# Taxonomy files of the taxonomies data repository (repository-code in its CITATION.cff: thesafetystack/the-safety-stack;
# layout taxonomies/<name>/<name>-<version>.yaml, one annotated tag per file, named as the file without .yaml), which
# this repository carries as a git subtree at data-repo/ (the single source of these bytes). Each entry: the
# pipeline path, a relative symlink to data-repo/<source>; the data-repository tag; the file's path there; its
# sha256 (the full-file digest the pins and work keys carry). tests/test_vendored_taxonomies.py checks every path
# here is that symlink, its bytes match the sha256 and its `version` field the tag. The pipeline paths stay because
# plans, stored run records (plan_pin.taxonomy) and eval records name them.
# To take a new version: `git subtree pull --prefix=data-repo <data repo> main --squash`, then a new symlink
# (or, for configs/models.yaml, which model_roles reads by name, stack.modelvocab, a re-pointed one) and its entry;
# keep a superseded path while a pin, an eval set, a stored run or a test names it. Each released version also has
# a per-version path (taxonomy/models-<version>.yaml beside configs/models.yaml), which the dataset release resolves
# by the sha256 a stored run pinned (stack/fold/dataset.py, D758), so rows judged under an earlier version export. A subtree pull that changes the
# bytes of a file listed here fails the sha256 check: a released file does not change. A `tag` names the data
# repository's annotated tag of that file; techniques-1.1.0, models-1.1.0 and orgs-0.2.0 (D738) are tagged when the
# data repository branch is pushed. orgs-0.2.2 (D778) was written into the subtree here first: the data repository
# takes the same bytes (and its tag) before this branch's subtree is pulled again.
