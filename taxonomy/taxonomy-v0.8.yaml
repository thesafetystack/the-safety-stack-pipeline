# Alignment Technique Taxonomy v0.8 — the canonical, self-contained taxonomy.
# One file: the ten facet definitions with their answer menus, the edge types,
# the descriptive fields, and the 292 techniques with their facet answers.
#
# Facet answers are objects {values, origin}. origin says how the answer got
# there: initial_pass = an educated prior, not yet checked against sources;
# source_confirmed = backed by quote-verified evidence; human_set = set or
# corrected by a curator; escalated = independent sources disagree, awaiting a
# human. All 292 entries currently carry initial_pass answers.
#
# Open schema point, stated rather than silently decided: the empty answer []
# is defined only for harm-area ("not harm-domain-specific"), but techniques
# that target no dispositional concern (pure data-quality filtering,
# watermarking, privacy methods) carry [] for failure-disposition too, since
# forcing a menu value there would fabricate. Whether failure-disposition gets
# an explicit none value is for schema review.
#
# Regenerate: builders/carryover.py -> builders/apply_revisions.py (this file).
version: '0.8'
status: canonical self-contained taxonomy; technique answers are an initial pass, every answer origin=initial_pass
facets:
- slug: locus
  name: Lifecycle locus
  cardinality: multi
  population: AI-scored
  difficulty: low
  description: 'Where in the model lifecycle the technique acts. Multi-valued: a guardrail classifier
    acts at inference and also serves live-traffic observation.'
  values:
  - slug: data
    name: Data
    description: Curating or filtering the training corpus before training.
  - slug: pretraining
    name: Pretraining
    description: 'Baked into base-model pretraining: objectives or interventions in the foundation model.'
  - slug: post-training
    name: Post-training
    description: 'Alignment after pretraining by weight update: SFT, preference optimization, RL.'
  - slug: inference
    name: Inference
    description: Synchronously in the request path at generation time (decoding controls, input/output
      filters).
  - slug: agentic-runtime
    name: Agentic runtime
    description: While the model runs inside a tool-use / agent loop (sandboxing, action gating).
  - slug: evaluation
    name: Evaluation
    description: Measuring a property or capability before deployment (red-teaming, dangerous-capability
      evals).
  - slug: release-gating
    name: Release gating
    description: The go / no-go decision before release (capability thresholds, safety cases).
  - slug: live-traffic
    name: Live traffic
    description: Asynchronous observation of live traffic or internals after deployment.
  - slug: post-deployment
    name: Post-deployment
    description: 'After-the-fact operations: incident response, takedown, account action.'
  - slug: access-control
    name: Access control
    description: Serving-side gating of who or what may use the model (KYC, tiered access, egress).
- slug: mechanism
  name: Safety mechanism
  cardinality: multi
  population: AI-scored
  difficulty: medium
  description: 'How the technique buys safety, the defense-in-depth axis. Also carries the intervention-vs-evidence
    distinction: a technique that changes the system uses shaping, restriction, correction, containment,
    gating, or response; one that only produces evidence uses detection, verification, transparency, or
    attribution.'
  values:
  - slug: shaping
    name: Shaping
    description: Changes what the model wants or does (training-time value alignment).
  - slug: restriction
    name: Restriction
    description: Removes or blocks a capability or content (data filtering, unlearning, blocklists).
  - slug: detection
    name: Detection
    description: Notices bad inputs, outputs, or behavior (classifiers, probes, monitors).
  - slug: containment
    name: Containment
    description: Limits harm even if behavior is bad (sandbox, permissions, kill-switch).
  - slug: gating
    name: Gating
    description: Gates who or what can invoke the model or a capability (KYC, tiered access, rate limit).
  - slug: verification
    name: Verification
    description: Checks or proves a property holds (safety cases, formal verification).
  - slug: correction
    name: Correction
    description: Fixes or steers behavior after detection (activation steering, model editing, rollback).
  - slug: transparency
    name: Transparency
    description: Makes the model's internals legible (interpretability).
  - slug: attribution
    name: Attribution
    description: Traces origin or provenance (watermarking, training-data attribution, content credentials).
  - slug: response
    name: Response
    description: Acts after an incident (incident response, takedown, threat-intel).
- slug: failure-disposition
  name: Failure disposition
  cardinality: multi
  population: AI-scored
  difficulty: medium
  description: The dispositional alignment concern the technique addresses, named as a property-vs-failure
    pole pair so a filter on either pole returns the same concern. Resistance to external attacks is the
    defends_against edge, not a value here.
  values:
  - slug: honesty-deception
    name: Honesty vs deception
    description: Truthful/calibrated vs strategically deceptive; includes scheming, alignment-faking,
      sandbagging.
  - slug: corrigibility-resistance
    name: Corrigibility vs shutdown-resistance
    description: Accepts correction/shutdown vs resists it; includes power-seeking, self-exfiltration.
  - slug: nonsycophancy-sycophancy
    name: Non-sycophancy vs sycophancy
    description: Holds true answers vs tells the user what they want to hear.
  - slug: rewardfaithful-rewardhacking
    name: Reward-faithfulness vs reward-hacking
    description: Pursues the intended goal vs games the proxy; reward-hacking, specification-gaming.
  - slug: goalrobust-misgeneralization
    name: Goal-robustness vs goal-misgeneralization
    description: Keeps the intended goal off-distribution vs misgeneralizes it.
  - slug: harmfulcontent-refusal
    name: Harmful-content refusal vs production
    description: Refuses to produce harmful content vs produces it; refusal training, safety SFT, constitutional
      harmlessness, hard prohibitions.
  - slug: general-alignment
    name: General alignment (HHH)
    description: Broad helpful-honest-harmless conduct, not tied to one pole.
- slug: harm-area
  name: Harm area
  cardinality: multi
  population: AI-scored
  difficulty: medium
  empty_is_legal: true
  description: The real-world harm domain the technique targets, roughly 1:1 with regulatory risk categories.
    Empty means not harm-domain-specific (most general training methods).
  values:
  - slug: bio
    name: Biological
    description: Biological-weapon uplift.
  - slug: chem
    name: Chemical
    description: Chemical-weapon uplift.
  - slug: nuclear
    name: Nuclear
    description: Nuclear-weapon uplift.
  - slug: radiological
    name: Radiological
    description: Radiological-weapon uplift.
  - slug: cyber-offense
    name: Cyber offense
    description: Offensive cyber capability or insecure code.
  - slug: autonomy
    name: Autonomy
    description: Autonomous replication, self-improvement, power-seeking, loss of control.
  - slug: persuasion
    name: Persuasion
    description: Mass persuasion, manipulation, influence operations.
  - slug: csae
    name: CSAE
    description: Child sexual abuse and exploitation.
  - slug: privacy
    name: Privacy
    description: Leakage, memorization, identification.
  - slug: fraud
    name: Fraud
    description: Scams, fraud, deception of third parties.
  - slug: misuse-at-scale
    name: Misuse at scale
    description: Abuse constituted by volume and automation (spam, flooding, mass inauthentic activity);
      co-tags the harm it amplifies.
  - slug: toxicity-hate
    name: Toxicity / hate
    description: Toxicity and hate speech.
  - slug: bias-discrimination
    name: Bias / discrimination
    description: Demographic, cultural, or linguistic bias and discrimination.
- slug: maturity
  name: Maturity
  cardinality: single
  population: human-set
  description: In-stack readiness, not effectiveness. Decays over time; needs last_verified. Human-set
    because it is not judgeable from a single source.
  values:
  - slug: theoretical
    name: Theoretical
    description: Concept only.
  - slug: experimental
    name: Experimental
    description: Research or lab demo.
  - slug: piloted
    name: Piloted
    description: Early or limited production.
  - slug: deployed
    name: Deployed
    description: Routine production use.
- slug: trend
  name: Trend
  cardinality: single
  population: human-set
  description: Field momentum, a forecaster and funder signal. Coarse on purpose. Human-set because it
    is not judgeable from a single source.
  values:
  - slug: emerging
    name: Emerging
    description: Gaining momentum.
  - slug: stable
    name: Stable
    description: Steady activity.
  - slug: declining
    name: Declining
    description: Losing activity.
  - slug: dormant
    name: Dormant
    description: Graveyard.
- slug: access-required
  name: Access required
  cardinality: single+
  population: AI-scored
  difficulty: low
  description: Minimum model access needed to apply the technique. Distinct from verifiability, which
    is what an outsider needs to check it. The first three values nest, so at most one is asserted; infra
    is orthogonal and may co-occur.
  values:
  - slug: white-box
    name: White-box
    description: Needs weights or gradients.
  - slug: grey-box
    name: Grey-box
    description: Needs activations or logits.
  - slug: black-box
    name: Black-box
    description: Needs only inputs and outputs.
  - slug: infra
    name: Infrastructure
    description: Needs deployment or infrastructure control.
- slug: verifiability
  name: Verifiability
  cardinality: single+
  population: AI-scored
  difficulty: high
  description: 'What an outsider needs to check the technique''s central claim: the produced property
    for interventions, the produced verdict for evaluations. Lenient: checks whether the property holds,
    not whether the technique caused it. Set by where the confirming evidence lives.'
  values:
  - slug: self-attested
    name: Self-attested
    description: No external signature; the claim rests on the developer's word.
  - slug: output-checkable
    name: Output-checkable
    description: Checkable from model outputs.
  - slug: grey-box-probing
    name: Grey-box probing
    description: Needs activation or logit access.
  - slug: weights-checkable
    name: Weights-checkable
    description: 'Needs weights: weight-level interpretability, weight watermarks, model-merge inspection.'
  - slug: training-process-inspection
    name: Training-process inspection
    description: The claim is about the training data or process, so outputs cannot prove it (data filtering,
      dedup, PII-scrubbing).
- slug: modality
  name: Modality
  cardinality: multi
  population: AI-scored
  difficulty: low
  description: 'Which modality the technique is specific to. Tag a specific modality only when the mechanism
    intrinsically requires it; otherwise agnostic. Storage encoding: agnostic techniques carry agnostic
    plus all modality tags, so exact-match filters catch them while agnostic preserves the genuine-vs-incidental
    distinction.'
  values:
  - slug: text
    name: Text
    description: Operates on text's raw form or peculiar features.
  - slug: vision
    name: Vision
    description: Operates on images.
  - slug: audio
    name: Audio
    description: Operates on audio.
  - slug: video
    name: Video
    description: Operates on video's temporal structure.
  - slug: agnostic
    name: Agnostic
    description: Not modality-specific.
- slug: threat-source
  name: Threat source
  cardinality: multi
  population: AI-scored
  difficulty: medium
  description: Who or what the technique defends against.
  values:
  - slug: none-benign
    name: None / benign
    description: No adversary (calibration, honesty).
  - slug: misuse-user
    name: Misuse (user)
    description: Deliberate misuse via the interface (jailbreaks).
  - slug: external-attacker
    name: External attacker
    description: Third party via the environment or supply chain, or asset theft (injection, poisoning,
      extraction, weight theft, incl. insiders).
  - slug: untrusted-model
    name: Untrusted model
    description: The model itself (scheming, sabotage; the AI-control setting).
edges:
- slug: defends_against
  target: technique
  description: This (defense) technique defends against that (attack) technique.
- slug: composes_with
  target: technique
  description: Works well stacked with another technique (defense-in-depth).
- slug: conflicts_with
  target: technique
  description: Interferes with / is redundant-or-counterproductive alongside another technique.
- slug: variant_of
  target: technique
  description: This entry is a variant of a parent technique (e.g. dpo.ipo -> dpo).
- slug: maps_to_standard
  target: standard
  description: Discharges or is referenced by a standard / regulation (NIST RMF, EU AI Act, ISO).
- slug: critiqued_by
  target: source
  description: A notable critique / negative result about this technique.
- slug: requires
  target: technique
  description: A precondition this technique needs to run (e.g. RLVR requires a verifiable reward).
fields:
- slug: tldr
  name: TL;DR
  description: One-paragraph plain-language gloss for a non-expert reader.
- slug: known_limitations
  name: Known limitations
  description: Where the technique itself breaks / residual risk after applying it.
- slug: evasion_gameability
  name: Evasion / gameability
  description: How it is bypassed, faked, or Goodharted (safety-washing surface).
- slug: safety_argument
  name: Safety argument
  description: Why it buys safety, the assumptions it rests on, and the conditions that defeat it.
- slug: requires_preconditions
  name: Requires / preconditions
  description: What must exist for it to work (a reward model, a verifier, human prefs).
- slug: scope_of_validity
  name: Scope of validity
  description: Conditions under which its evidence holds (scale/regime, languages, modalities, single-
    vs multi-turn).
- slug: effectiveness
  name: Effectiveness
  description: Coarse, eval-anchored effect where known; carries claim_tier.
- slug: flagship_example
  name: Flagship example
  description: One illustrative deployed instance / model.
- slug: resource-cost
  name: Resource cost
  description: 'All-in cost to apply and run. Values: low / medium / high / unknown. Read when choosing
    among candidates, not searched on.'
  values:
  - low
  - medium
  - high
  - unknown
- slug: artifact-form
  name: Artifact form
  description: What artifact or change you build or run. Read when deciding what to build, not searched
    on.
  values:
  - data-pipeline
  - training-objective
  - model-edit
  - auxiliary-model
  - decoding
  - prompt
  - orchestration-protocol
  - infra-control
  - eval-benchmark
  - analysis-method
  - theory-framework
techniques:
- slug: model-based-data-quality-filtering
  name: Model-based data quality filtering
  type: technique
  family: data-curation
  description: Uses trained classifier or scoring models (n-gram perplexity, neural regressors, or prompted
    LLMs) to rate documents in a training corpus on quality dimensions and drop low-scoring or policy-violating
    text before training. Distinguished from hand-written heuristic filters by using a learned model as
    the quality signal.
  fields:
    resource-cost: medium
    artifact-form:
    - data-pipeline
    - auxiliary-model
  facets:
    locus:
      values:
      - data
      origin: initial_pass
    mechanism:
      values:
      - restriction
      origin: initial_pass
    failure-disposition:
      values: []
