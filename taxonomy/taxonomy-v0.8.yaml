  name: n-gram classifier (model-based quality filtering)
  type: variant
  family: data-curation
  variant_of: model-based-data-quality-filtering
  description: Scores training text by n-gram language-model perplexity and filters documents that deviate
    strongly from coherent natural language, giving a cheap, fast first-pass quality signal. The lowest-cost
    model-based filtering variant.
  fields:
