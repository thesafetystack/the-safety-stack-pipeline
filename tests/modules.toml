# Touched path -> test files, for tools/devtest.py (A11, D490).
#
# Each [[map]] entry: `paths` are fnmatch globs over repo-relative paths (`*` also crosses `/`); `tests` run in the
# dev tier (-m "not slow and not tools"); `slow` are added by `--with-slow` (which drops the marker filter: heavy
# files, scenario worlds, tool tests). A name is a file under tests/ without `test_` and `.py` (`store_chain` =
# tests/test_store_chain.py), optionally with `::<node>`. A path matching several entries gets their union; a
# touched test file runs itself. "Infra" modules (stack/plan.py, stack/store/chain.py, stack/stage_runner.py, ...)
# are imported by most test files: they list only the files about them, and the dev run adds the smoke set.
# tests/test_devtest.py checks that every stack/**/*.py and workflows/** file matches some glob here and that
# every name exists: a new module cannot fall out of the map.

