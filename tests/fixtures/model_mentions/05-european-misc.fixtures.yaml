# Fixtures for _build/05-european-misc.yaml — every name-variant string from the
# MD entries (verbatim, "(bedrock)"-style annotations stripped) plus canonical
# display names. Parenthesized display names ("Mistral Small (2402)", "Jamba
# (v0.1)", "Command (original)", "Sonar (2025)", "Leanstral (2603)") are replaced
# by their unparenthesized forms — "(" is not a separator char, so the literal
# display string cannot match its own version pattern by design.
# Rolling API aliases (-latest, jamba-large/-mini) map to their line/family per
# schema group-level attribution. Bare brand words map per the audit's
# typical-reading table (family/line), not to first models.
# Character AI strings (character ai, character.ai, c.ai) have no node — skipped.

