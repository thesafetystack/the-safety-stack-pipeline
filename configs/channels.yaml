# channels.yaml — configured origins of sources (10-design §8, §5.1).
# Concept groups cluster synonym surface forms for ONE technique each and carry a
# `techniques:` mapping into the taxonomy — the coverage-topic <-> taxonomy join that
# absence claims need. Validated against channels.schema.json.
version: "2.5.1"   # 2.5.1 (2026-11-02): comments only (attributions to the maintainer and internal labels reworded;
                   # D792). No value moves.
                   # 2.5.0 (Chinese coverage; approved 2026-10-30): `keyword_cuts.keep_venues` on openalex and
                   # semantic_scholar (ACL Anthology, AAAI, IJCAI, NDSS and PLOS DOIs pass the publisher cut; the
                   # allowlist digest is in every cut group's key: OpenAlex's 59 and S2's 59 group queries re-sweep from 2015 once); a new concept
                   # group `llm-safety` (OpenAlex quoted with the CS filter, S2, no forum queries: the new concept-group
                   # field `forum_terms`); three institutions (Shanghai AI Lab, BAAI, Zhipu; CS field), new keys
                   # `inst:<Iid>` only; the feed channel `aisafetychina_substack` (Concordia AI's newsletter);
                   # semantic_scholar's `keyword_cuts.venue_ai_term` (the allowlist keeps only AI-term hits there; the
                   # vocabulary digest in its 59 group keys, the same one re-sweep).
                   # 2.4.0: institutions[].org are ids of the organisation vocabulary (D737): google-deepmind,
                   # mistral-ai, moonshot-ai become deepmind, mistral, moonshot (the registry's slugs). The org slug is
                   # only the query label (metadata.matched_by) and a v3 topic key, in no coverage key: no re-sweep.
                   # 2.3.0: the openalex channel's `keyword_cuts` gain the pre-2020 exception (D654): `publisher_cut_floor`
                   # (hits before it with a pre-2020 safety stem bypass `drop_sources`) and `field_filter_floor` /
                   # `field_filter_groups` (umbrella asked without the CS-field filter before 2020). Both are in the
                   # group queries' coverage keys; D653's work type already makes every OpenAlex key new (one re-sweep
                   # from the floor, plan batch-2026-10a revision 5). semantic_scholar's `keyword_cuts` gain the same
                   # `publisher_cut_floor` (no field filter there): its 59 group keys change, one re-sweep from 2015.
                   # 2.2.0: two new concept groups, `legacy-alignment` (AI-context gated) and `legacy-safety`
                   # (the 2006-2019 vocabulary; the 2015 backfill, D646). Additive: new coverage keys only.
                   # 2.1.0: semantic_scholar `politeness.rate_rps` 0.95 -> 0.4 and now READ: it is the cross-process Gate's
                   # S2 interval (2.5 s) for collect, the lookups and acquire (D550). Values only.
                   # 2.0.0: keys read by no v4 code removed (D438; 2026-10-14): every channel's
                   # `schedule`, `politeness.max_concurrency`, `breadth_presets.*.from_default` and the top-level
                   # `recall_seeds` (removed). Values of read keys unchanged.
                   # 1.12.0: the backfill cuts (D304: the proposed cuts accepted; collection-yield.md
                   # §10): `keyword_cuts` on the openalex and semantic_scholar channels (concept-group hits only:
                   # publisher and no-DOI works and self-publication servers dropped, SSRN kept; OpenAlex's 24
                   # unquoted non-broad groups keep a hit only with an AI term, stack/rules.py) and `s2_terms: []`
                   # for scheming, specs and control. Every OpenAlex and S2 concept-group coverage key gains the
                   # cut set (a new watermark key: the next run re-sweeps those queries from the floor).
                   # 1.11.0: collection-yield cuts C2 (OpenAlex half) and C3 (2026-10-13, D270): heuristic-arguments
                   # gets `openalex_terms: []` (skipped on OpenAlex too); scientist-ai loses "non-agentic AI" (terms
                   # and openalex_terms). Query digests that change: OpenAlex `group:scientist-ai` (new filter, so a
                   # new watermark key: its window re-sweeps from the floor); OpenAlex `group:heuristic-arguments`
                   # (no longer asked); S2 `group:scientist-ai` (new s2_query); forums `kw:non-agentic AI` x 2 forums
                   # (no longer asked); arXiv `kw:group:scientist-ai` keeps its label key (its watermark carries).
                   # Values only.
                   # 1.10.0: record projections gain the fields stack/identity.py's key adders read: lesswrong
                   # `url` (a linkpost's target), openalex `locations` (arXiv locations); one new sources row per
                   # post/work on its next observation (round 5, track T-ID). Values only.
                   # 1.9.0: concept-group `s2_terms` (replaces `terms` on Semantic Scholar; empty = skip there):
                   # steerability and heuristic-arguments skipped on S2 (round 4, track P). Additive.
                   # 1.8.0: the link channels links_paper/forum/url/social (collect.links: link targets selected in
                   # newsletter and flagged manual bodies; non-merging `relay` keys; round 4, track L2). Additive.
                   # 1.7.0: `kind: feed` channels (collect.feeds) with optional `include_re`, and the manual
                   # sources' channels manual_url/paper/forum/social (collect.manual, non-merging `flag` keys;
                   # round 4, track L). Additive.
                   # 1.6.3: `x` channel made real for collect.x-lookup (miss_means, non_merging_keys,
                   # record_projection; round 4, track X). Additive.
                   # 1.6.2: `card_dates` lookup channel (collect.card-dates-lookup, T2.6). Additive.
                   # 1.6.1: `record_projection` set on the five search channels (stable provider fields
                   # minus counters, C23) and `miss_means: unknown` stated on openalex (T2.1). Values
                   # only; no v3 collector records a non-merging (`related`, `relay`) key yet.
                   # 1.6.0: identity keys for the store pipeline (design §3.5, §6; D13, D42): every
                   # channel declares its `channel_group` (required); optional `miss_means`
                   # (default `unknown`), `non_merging_keys`, `record_projection` (C23); top-level
                   # `channel_groups` lists each group's merging key kinds. Additive (§8.1).
                   # 1.5.0 (v3; fetch.http is retired and v4 reads no `max_concurrency`): `max_concurrency` is now READ (fetch.http's per-host in-flight cap;
                   # absent = 1, today's behaviour) and declared on lesswrong/alignmentforum: at
                   # 3.3 rps one in-flight request reaches ~2 rps, two reach the declared rate.
                   # Additive — no existing entry changes meaning (§8.1).
                   # 1.4.0: breadth caps raised (standard 2000->5000, deep 8000->10000) — more
                   # per-run headroom for over-cap concept groups; truncation semantics unchanged.
                   # 1.3.0: `ai_context` ported (its consumer, collect.semantic_scholar, now
                   # exists). Additive — no existing entry changes meaning (§8.1).

breadth_presets:
  standard: { max_results_per_query: 5000 }
  deep:     { max_results_per_query: 10000 }

# The AI-context disjunction ANDed onto `misuse: true` concept groups on the PHRASE-MATCH channels
# (v1 search_config.yaml `ai_context`; v1 applied it on Semantic Scholar + Europe PMC). "bioweapon"
# alone returns the whole biosecurity literature, so a misuse group is only meaningful intersected
# with an AI-context term — which is why collect.openalex skips those groups outright (a token-AND
# backend cannot express the intersection) and why the misuse axis needs a phrase-match channel.
# Read by collect.semantic_scholar; a future collect.europepmc reads the same list.
ai_context:
  - "large language model"
  - "foundation model"
  - "language model"
  - "artificial intelligence"
  - "frontier model"

# The concept groups (62 as of 1.11.0; the first 42 ported from v1 `pipeline/config/search_config.yaml`, 2026-07-22). They
# ARE the recall strategy: collect.openalex emits one OR-grouped query per group, and
# collect.forums one query per TERM, each receipt carrying `group:<id>` (+ `technique:<slug>`)
# topic keys — the coverage-topic <-> taxonomy join absence claims read. Until this port the
# file carried three groups, so both sweeps ran at ~7% of v1's query breadth.
#
# Two deliberate departures from the v1 file:
#   * ids are kebab-case (`misuse-bio`, not `misuse_bio`) — the config slug pattern forbids `_`;
#   * `techniques:` is populated for 37 groups (of 42 at the port; 37 of 62 as of 1.11.0) against the pinned taxonomy-v0.6
#     (292 techniques). The 5 unmapped groups carry `group:<id>` alone — a wrong technique
#     slug would be a silently false taxonomy join, an absent one is just a missing join.
#
# v1's `ai_context` list is ported above as of channels 1.3.0 — `collect.semantic_scholar` reads
# it, so it is no longer committed-but-unread config (the trap `breadth_presets` fell into once).
# v1's per-source group subsets (`sources.europepmc`, which ran EPMC over 21 of the 42 groups) are
# still NOT ported: `concept_groups:` on the channel already expresses that selection when a
# `collect.europepmc` workflow exists to read it.
concept_groups:
  # ── umbrella / framing ─────────────────────────────────────────────────────
  - id: umbrella
    broad: true
    terms: ["AI safety", "AI alignment", "alignment of large language models", "AGI safety", "existential risk from AI"]
  - id: superalignment
    terms: ["superalignment", "aligning superhuman models"]
  # ── iterative alignment / training ─────────────────────────────────────────
  - id: rlhf
    terms: ["RLHF", "reinforcement learning from human feedback", "RLAIF", "reinforcement learning from AI feedback"]
    techniques: [rlhf, rlaif]
  - id: preference-opt
    terms: ["direct preference optimization"]
    techniques: [dpo]
  - id: specs
    broad: true
    terms: ["constitutional AI", "deliberative alignment", "model specification", "model spec"]
    s2_terms: []  # backfill cut 5 (collection-yield.md §10): 33 S2 hits a week, 0 relevant ("model specification")
    techniques: [constitutional-ai, deliberative-alignment, model-specification]
  - id: safety-tuning
    broad: true
    terms: ["safety fine-tuning", "safety alignment", "refusal training", "inoculation prompting"]
    techniques: [safety-sft-refusal-training, inoculation-prompting, safety-policy-guided-alignment]
  # LLM safety vocabulary (approved 2026-10-30): the Chinese technical-safety literature's words (Concordia
  # database misses: 91 of 92 carry no other group's phrase) for safety benchmarks and evaluations, harmful content,
  # harmlessness and honesty, safety detectors, and safe RL (the post-2020 term; pre-2020 safe-RL works pass the
  # D654 stems). Checked against the other groups: "safety alignment" and "safety fine-tuning" stay safety-tuning,
  # "safety classifier" and "guardrails" jailbreak, "truthfulness language models" deception-detect, "safe
  # exploration" legacy-safety. Most of these phrases are common outside AI (drug "safety evaluation", "honesty" in
  # psychology: OpenAlex 2015-now 19,581 and 37,173 works unfiltered), so OpenAlex asks them quoted with the CS-field
  # filter (`broad`: 7,525 works, 2,792 arXiv-located; with the AI context instead "safe reinforcement learning"
  # keeps 59 of 1,246), Semantic Scholar as phrases (64,498 hits before the publisher cut keeps the arXiv-located
  # ones), and the forums not at all (`forum_terms: []`: LessWrong's loose search returns 1,148-21,963 posts per
  # phrase). Counts probed 2026-10-30, summed per phrase. New key `group:llm-safety` on OpenAlex and S2; no
  # `techniques:` (no single technique).
  - id: llm-safety
    broad: true
    terms: ["LLM safety", "safety benchmark", "safety evaluation", "harmful content", "harmlessness", "honesty",
            "safety detector", "safe reinforcement learning"]
    openalex_terms: ['"LLM safety"', '"safety benchmark"', '"safety evaluation"', '"harmful content"', '"harmlessness"',
                     '"honesty"', '"safety detector"', '"safe reinforcement learning"']
    forum_terms: []
  # ── steering / unlearning / control / safeguards ───────────────────────────
  - id: steering
    broad: true
    terms: ["activation steering", "steering vectors", "representation engineering", "activation patching", "inference-time intervention", "concept erasure"]
    techniques: [activation-steering-repe, representation-concept-suppression, circuit-breakers-representation-rerouting]
  - id: unlearning
    terms: ["machine unlearning", "knowledge unlearning", "concept unlearning", "tamper-resistant safeguards"]
    techniques: [machine-unlearning, finetuning-resistant-tamper-resistant-safety]
  - id: control
    broad: true
    terms: ["AI control", "control protocol", "untrusted model", "trusted monitoring", "AI control evaluations"]
    openalex_terms: ["untrusted model", "AI control evaluations"]
    s2_terms: []  # backfill cut 5 (collection-yield.md §10): 22 S2 hits a week, 0 relevant
    techniques: [ai-control-protocols, trusted-monitoring-suspicion-scoring]
  - id: jailbreak
    broad: true
    terms: ["jailbreak", "jailbreaking large language models", "prompt injection", "adversarial robustness language models", "safety classifier", "constitutional classifiers", "guardrails"]
    techniques: [adversarial-training-jailbreak-robustness, constitutional-classifiers, jailbreak-adversarial-input-detection-classifiers, prompt-injection-defense-agentic, multi-layer-guardrail-stack]
  - id: cot-monitor
    terms: ["chain-of-thought monitoring", "chain-of-thought faithfulness", "reasoning faithfulness"]
    techniques: [chain-of-thought-monitoring, cot-auditing-for-agents]
  # ── model psychology / misalignment behaviours ─────────────────────────────
  - id: misalignment-behaviors
    terms: ["emergent misalignment", "alignment faking", "sleeper agents", "deceptive alignment", "backdoor language models"]
    techniques: [model-organisms-of-misalignment, alignment-faking-eval, scheming-deceptive-alignment-evaluation, data-poisoning-backdoor-defenses-pretraining]
  - id: reward-hacking
    terms: ["reward hacking", "reward tampering", "specification gaming", "goal misgeneralization", "reward overoptimization", "Goodhart"]
    techniques: [anti-reward-hacking-mitigation, reward-hacking-eval, agentic-reward-hacking-resistance]
  - id: persona
    broad: true
    terms: ["sycophancy", "persona vectors", "character training", "emergent values"]
    techniques: [character-persona-training, anti-sycophancy-training, sycophancy-eval]
  - id: power-seeking
    broad: true
    terms: ["power-seeking", "instrumental convergence", "shutdown resistance", "self-preservation"]
    techniques: [self-exfiltration-oversight-deactivation-detection, kill-switch-shutdown-criteria]
  # ── data / goal robustness ─────────────────────────────────────────────────
  - id: data-safety
    terms: ["data poisoning language models", "backdoor language models", "pretraining data filtering", "synthetic data for alignment"]
    techniques: [data-poisoning-backdoor-defenses-pretraining, heuristic-rule-based-data-filtering, model-based-data-quality-filtering, synthetic-training-data-generation, training-data-poisoning-detection]
  - id: rl-safety
    broad: true
    terms: ["reward modeling", "reward model", "assistance games", "cooperative inverse reinforcement learning", "mild optimization", "quantilization"]
    techniques: [reward-modeling, inverse-rl-cirl, safe-constrained-rlhf]
  # ── white-box / interpretability ───────────────────────────────────────────
  - id: mech-interp
    terms: ["mechanistic interpretability"]
    techniques: [mechanistic-interp]
  - id: sparse-coding
    terms: ["sparse autoencoder", "dictionary learning", "polysemanticity", "monosemanticity"]
    openalex_terms: ["sparse autoencoder interpretability", "dictionary learning interpretability", "polysemanticity", "monosemanticity"]
    techniques: [sparse-autoencoders]
  - id: interp-tools
    terms: ["logit lens", "causal scrubbing", "causal abstraction", "interchange intervention", "probing classifiers"]
    techniques: [linear-probes, automated-interpretability]
  - id: model-diffing
    terms: ["model diffing", "crosscoder"]
    techniques: [model-diffing]
  - id: dev-interp
    terms: ["developmental interpretability", "singular learning theory", "grokking"]
  - id: data-attribution
    broad: true
    terms: ["training data attribution", "data influence functions"]
    techniques: [influence-functions-tda, training-data-attribution-membership-testing]
  - id: elk
    terms: ["eliciting latent knowledge"]
    techniques: [eliciting-latent-knowledge]
  - id: deception-detect
    terms: ["deception detection language models", "truthfulness language models", "AI deception"]
    techniques: [honesty-anti-deception-training, honesty-calibration-evaluation-suite]
  - id: anomaly
    terms: ["mechanistic anomaly detection"]
    techniques: [mechanistic-anomaly-detection, ood-activation-space-anomaly-detection]
  # ── safety by construction / theory ────────────────────────────────────────
  - id: safety-by-construction
    terms: ["guaranteed safe AI", "provably safe AI", "formal verification neural network"]
    techniques: [formal-verification-gsai]
  - id: corrigibility
    terms: ["corrigibility", "shutdown problem", "safe interruptibility"]
    techniques: [corrigibility-behaviors-training, kill-switch-shutdown-criteria]
  - id: agent-foundations
    terms: ["agent foundations", "logical induction", "embedded agency"]
    # phrase-only terms — nothing here survives OpenAlex's token-AND, so the
    # group is skipped there and runs only on the phrase-match APIs (v1 parity).
    openalex_terms: []
    techniques: [agent-foundations]
  # ── make-AI-solve-it / oversight ───────────────────────────────────────────
  - id: oversight
    terms: ["scalable oversight", "amplified oversight", "recursive reward modeling", "iterated amplification"]
    techniques: [recursive-reward-modeling, iterated-distillation-and-amplification, process-based-supervision, sandwiching-evaluation]
  - id: w2s
    terms: ["weak-to-strong generalization"]
    techniques: [weak-to-strong-generalization]
  - id: debate
    terms: ["AI safety via debate", "language model debate"]
    techniques: [ai-safety-via-debate]
  # ── evals ──────────────────────────────────────────────────────────────────
  - id: capability-evals
    terms: ["dangerous capability evaluation", "frontier model evaluation", "capability elicitation"]
    techniques: [dangerous-capability-evaluation, capability-elicitation-methodology]
  - id: autonomy-evals
    broad: true
    terms: ["autonomous agent evaluation", "agentic safety evaluation", "long-horizon agent"]
    techniques: [sabotage-covert-side-task-eval]
  - id: scheming
    terms: ["AI scheming", "situational awareness", "evaluation awareness"]
    openalex_terms: ["AI scheming"]
    s2_terms: []  # backfill cut 5 (collection-yield.md §10): 38 S2 hits a week, 0 relevant ("situational awareness": driving)
    techniques: [scheming-deceptive-alignment-evaluation, situational-eval-awareness-detection, sandbagging-detection]
  - id: stego
    terms: ["steganography language models", "LLM steganography", "linguistic steganography", "encoded reasoning"]
  - id: red-team
    terms: ["automated red teaming", "red teaming language models"]
    techniques: [automated-red-teaming, human-red-teaming]
  # ── misuse / WMD. `misuse: true` = the querying workflow ANDs an AI-context term so the
  # sweep does not ingest all of biosecurity. collect.openalex SKIPS these groups (token-AND
  # cannot express that intersection) — exactly as v1 did; they are for the phrase-match APIs.
  - id: misuse-bio
    misuse: true
    terms: ["biosecurity", "bioweapon", "dual-use biology", "biological weapons", "pathogen"]
    techniques: [cbrn-high-risk-domain-hazard-classifier]
  - id: misuse-chem
    misuse: true
    terms: ["chemical weapons", "CBRN", "chemical synthesis"]
    techniques: [cbrn-high-risk-domain-hazard-classifier]
  - id: misuse-cyber
    misuse: true
    terms: ["cyber capability evaluation", "offensive cyber", "cybersecurity capabilities", "autonomous exploitation"]
    techniques: [dangerous-capability-evaluation]
  # ── governance-tech / multi-agent ──────────────────────────────────────────
  - id: governance
    broad: true
    terms: ["responsible scaling policy", "frontier safety framework", "AI safety case"]
  - id: multi-agent
    broad: true
    terms: ["multi-agent alignment", "multi-agent safety", "collusion language models", "cooperative AI"]
    techniques: [multi-agent-safety-protocols]
  # ── SR-scope extension (2026-10-12; docs/scope/shallow-review.md (c), (d) I1-I10) ──
  # No `techniques:` (taxonomy-v0.6 has no entries for these areas; a wrong slug is a false join),
  # so their coverage keys `group:<id>` only. `needs_ai_context: true` = the term alone is another
  # field's vocabulary ("decision theory" is operations research and medicine, (d) E1/E2): the
  # phrase-match collectors and arXiv's keyword family AND it with `ai_context`; collect.openalex
  # sends `("t1" OR "t2") AND ("<ai_context>" OR …)` as a boolean phrase query (probe 2026-10-12:
  # "decision theory" 19,194 works = 617 with the AI disjunction + 18,577 without it).
  # `openalex_terms` here are the same phrases QUOTED: OpenAlex phrase-matches a quoted term
  # ("decision theory" 19,194 vs unquoted 413,929) and ORs quoted phrases with `|`; unquoted, a
  # two-common-word phrase token-ANDs into a flood (the agent-foundations convention above).
  - id: decision-theory-af
    terms: ["updateless decision theory", "functional decision theory", "logical counterfactuals", "logical uncertainty"]
    openalex_terms: ['"updateless decision theory"', '"functional decision theory"', '"logical counterfactuals"', '"logical uncertainty"']
  - id: decision-theory
    needs_ai_context: true
    terms: ["decision theory", "Newcomb's problem"]
  - id: acausal
    terms: ["acausal trade", "acausal coordination", "evidential cooperation in large worlds", "multiverse-wide cooperation"]
    openalex_terms: ['"acausal trade"', '"acausal coordination"', '"evidential cooperation in large worlds"', '"multiverse-wide cooperation"']
  - id: anthropics
    needs_ai_context: true
    terms: ["anthropic reasoning", "self-sampling assumption", "self-indication assumption", "simulation argument"]
  - id: infra-bayes
    terms: ["infra-Bayesianism", "infra-Bayesian", "learning-theoretic agenda"]
    openalex_terms: ['"infra-Bayesianism"', '"infra-Bayesian"', '"learning-theoretic agenda"']
  - id: natural-abstractions
    terms: ["natural abstraction", "natural latents", "platonic representation hypothesis"]
    openalex_terms: ['"natural abstraction"', '"natural latents"', '"platonic representation hypothesis"']
  - id: tiling
    terms: ["tiling agents", "Löbian obstacle", "Vingean reflection"]
    openalex_terms: ['"tiling agents"', '"Löbian obstacle"', '"Vingean reflection"']
  - id: program-equilibrium
    terms: ["program equilibrium", "open-source game theory", "safe Pareto improvements", "commitment races"]
    openalex_terms: ['"program equilibrium"', '"open-source game theory"', '"safe Pareto improvements"', '"commitment races"']
  - id: game-theory-ai
    needs_ai_context: true
    terms: ["game theory", "mechanism design", "evolutionary game theory"]
  - id: gradual-disempowerment
    terms: ["gradual disempowerment", "human disempowerment"]
    openalex_terms: ['"gradual disempowerment"', '"human disempowerment"']
  - id: alignment-targets
    terms: ["pluralistic alignment", "law-following AI"]
    openalex_terms: ['"pluralistic alignment"', '"law-following AI"']
  - id: social-choice-ai
    needs_ai_context: true
    terms: ["social choice", "value aggregation"]
  - id: model-psychology
    terms: ["hyperstition", "machine psychology", "LLM psychology"]
    openalex_terms: ['"hyperstition"', '"machine psychology"', '"LLM psychology"']
  - id: introspection
    needs_ai_context: true
    terms: ["introspection"]
  - id: agi-metrics
    terms: ["definition of AGI", "levels of AGI", "measuring AGI"]
    openalex_terms: ['"definition of AGI"', '"levels of AGI"', '"measuring AGI"']
  - id: heuristic-arguments
    terms: ["heuristic arguments"]
    # S2 and OpenAlex: 0 of 14 S2 hits relevant in the 2026-10-12 SR window, the OpenAlex ones physics and
    # mathematics (docs/design/collection-yield.md C2, adopted on S2 673c3ee, on OpenAlex 2026-10-13);
    # ARC's work arrives through arc_blog and arXiv.
    openalex_terms: []
    s2_terms: []
  - id: brain-like-agi
    terms: ["brain-like AGI", "NeuroAI safety"]
    openalex_terms: ['"brain-like AGI"', '"NeuroAI safety"']
  - id: scientist-ai
    # "non-agentic AI" dropped (collection-yield.md C3, 2026-10-13): the clear hits say "Scientist AI".
    terms: ["Scientist AI"]
    openalex_terms: ['"Scientist AI"']
  - id: steerability
    needs_ai_context: true
    terms: ["steerability"]
    # OpenAlex stems the word to "steer" (beam steering, steering vectors): the 2026-10-12 window
    # returned 278 works in 30 days, 25 of them saying "steerab". Phrase-match channels only.
    openalex_terms: []
    # S2 stems it too: 669 of 836 S2 rows of the same window (collection-yield.md C1).
    s2_terms: []
  - id: shard-theory
    terms: ["shard theory"]
    openalex_terms: ['"shard theory"']
  # ── legacy vocabulary, 2006-2019 (2.2.0, the 2015 backfill; D646) ─────────────────────────────
  # The period's umbrella and technique names that no modern group carries. New groups only: no
  # existing group, term or `ai_context` changes, so nothing already swept is asked again; the new
  # coverage keys (OpenAlex/S2 `group:<id>`, forums `kw:<term>` x 2 forums, arXiv `kw:group:<id>`)
  # sweep from their collectors' floors once. No `techniques:` (framing words, not one technique).
  # `legacy-alignment`: collision-prone words ("value alignment" in organisations, "value learning"
  # in education), so the phrase-match channels AND them with `ai_context`; forums send the terms as
  # they are. `legacy-safety`: distinctive on their own, no AI clause ("quantilizer" and "safely
  # interruptible" beside the existing "quantilization" / "safe interruptibility": no stemming is
  # guaranteed across these forms). `openalex_terms` are the phrases quoted (decision-theory-af's
  # convention).
  - id: legacy-alignment
    needs_ai_context: true
    terms: ["value alignment", "value learning", "intelligence explosion", "utility indifference", "goal preservation"]
    openalex_terms: ['"value alignment"', '"value learning"', '"intelligence explosion"', '"utility indifference"', '"goal preservation"']
  - id: legacy-safety
    terms: ["Friendly AI", "oracle AI", "AI boxing", "safe exploration", "inverse reward design", "wireheading",
            "impact measure", "attainable utility", "safely interruptible", "off-switch game", "quantilizer",
            "reflective oracle", "timeless decision theory", "inner alignment", "mesa-optimizer"]
    openalex_terms: ['"Friendly AI"', '"oracle AI"', '"AI boxing"', '"safe exploration"', '"inverse reward design"',
                     '"wireheading"', '"impact measure"', '"attainable utility"', '"safely interruptible"',
                     '"off-switch game"', '"quantilizer"', '"reflective oracle"', '"timeless decision theory"',
                     '"inner alignment"', '"mesa-optimizer"']

