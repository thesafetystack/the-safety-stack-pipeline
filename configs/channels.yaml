  # Manual sources (collect.manual): `<store>/overrides/manual_sources.yaml`, human-curated, one entry per URL
  # with flags (`collect_links`, `accept`) carried as non-merging `flag` keys. Each URL is typed by
  # stack.urls.link_keys and lands on the channel of its identity group. (`manual` above is the v1 drop folder.)
  - id: manual_url
    kind: manual
    location: "overrides/manual_sources.yaml"
    license_class: public_web
    channel_group: url
    miss_means: withdrawn       # an entry revoked or removed from the file is retracted (stage line miss_cap: 1)
    non_merging_keys: [flag]

  - id: manual_paper
    kind: manual
    location: "overrides/manual_sources.yaml"
    license_class: restricted   # as the paper search channels (D8): the acquired copy's licence is unknown
    channel_group: paper
    miss_means: withdrawn
    non_merging_keys: [flag]

  - id: manual_forum
    kind: manual
    location: "overrides/manual_sources.yaml"
    license_class: open         # LessWrong / AF / EA Forum posts: CC BY by default, as `lesswrong`
    channel_group: forum
    miss_means: withdrawn
    non_merging_keys: [flag]

  - id: manual_social
    kind: manual
    location: "overrides/manual_sources.yaml"
    license_class: api_tos      # as `x`: the text arrives through the X API (collect.x-lookup)
    channel_group: social
    miss_means: withdrawn
    non_merging_keys: [flag]

  # Link targets (collect.links, round 4 (L2); docs/design/link-crawling.md §4.7): one source per selected target of
  # a linking document's body (newsletters, flagged manual sources), on the channel of the target's identity group
  # (stack.urls.link_keys). `kind: manual` as `x`: the schema has no derived kind. Keys: the target's typed keys plus
  # one non-merging `relay` key per linking document (its url key). A target no linking document links any more is
  # retracted (`miss_means: withdrawn`, stage line `miss_cap: 1`). The record (the `provider_record` in-band entry, D522) holds the target, every
  # linking document with its occurrences (anchor, context, heading) and the selector's decision.
  - id: links_paper
    kind: manual
    location: "collect.links (documents head)"
    license_class: restricted   # as manual_paper: the acquired copy's licence is unknown
    channel_group: paper
    miss_means: withdrawn
    non_merging_keys: [relay]
    record_projection: [target, linked_from]

  - id: links_forum
    kind: manual
    location: "collect.links (documents head)"
    license_class: open         # as manual_forum / lesswrong
    channel_group: forum
    miss_means: withdrawn
    non_merging_keys: [relay]
    record_projection: [target, linked_from]

  - id: links_url
    kind: manual
    location: "collect.links (documents head)"
    license_class: public_web
    channel_group: url
    miss_means: withdrawn
    non_merging_keys: [relay]
    record_projection: [target, linked_from]

  - id: links_social
    kind: manual
    location: "collect.links (documents head)"
    license_class: api_tos      # as `x`: the text arrives through the X API (collect.x-lookup)
    channel_group: social
    miss_means: withdrawn
    non_merging_keys: [relay]
    record_projection: [target, linked_from]
