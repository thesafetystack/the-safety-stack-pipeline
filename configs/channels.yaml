  # ───────────────────────────────────────────────────────────────────────────
  # Track L (round 4): newsletter feeds and manual sources.
  #
  # `kind: feed` = one RSS/Atom feed per channel, read by collect.feeds (workflows/collect/feeds/main.py):
  # one `sources` row per item (url group), the item's full body (`content:encoded`, Atom `content`) minted
  # in-band as role `post` (raw text/html) so acquire needs no fetch; an item without a body is listing-only.
  # A new Substack / newsletter / blog feed is one entry here (id, location = the feed URL, channel_group:
  # url, license_class, optional include_re / self_published_org) plus, in the plan, a `collect.feeds` stage line
  # (only links-scratch.yaml has one) and one `acquire.wants` line; see docs/howto/add-feed.md.
  - id: zvi_substack            # Zvi Mowshowitz, "Don't Worry About the Vase" (weekly AI #N and the rest);
    kind: feed                  #   Substack RSS, 20 newest items, each with content:encoded (probe 2026-10-12)
    location: "https://thezvi.substack.com/feed"
    license_class: public_web
    channel_group: url
    politeness: { rate_rps: 0.5 }

