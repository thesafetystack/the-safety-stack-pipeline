# Identity groups (design §6): `gather` unions documents on these key kinds, and only within a
# group (v3 matched globally). Key kinds a channel records but never merges on (`related`,
# `relay`, the X context keys) go on the channel as `non_merging_keys`.
channel_groups:
  paper:  { merge_keys: [doi, arxiv, openalex, s2, pmid, zenodo] }   # arXiv-DOI bridge: stack/scholarly_records.py
  forum:  { merge_keys: [fm_post] }      # ForumMagnum post id: an LW/AF crosspost is one document
  url:    { merge_keys: [url] }          # canonical URL
  social: { merge_keys: [x_post] }       # one post per document
  record: { merge_keys: [registry_id] }  # incident / OSINT registry id

channels:
  - id: openalex               # kind: search
    kind: search
    location: "https://api.openalex.org/works"
    license_class: open
    channel_group: paper
    breadth: standard
    concept_groups: all        # OpenAlex auto-skips misuse groups, CS-filters broad groups
    from_date: "2020-01-01"
    politeness: { rate_rps: 5, mailto: env }
    miss_means: unknown          # §5.6: an OpenAlex miss is never a withdrawal
    # SELECT_FIELDS minus the counter `cited_by_count` (C23); `locations` is read by the
    # openalex_arxiv_location key adder (stack/identity.py)
    record_projection: [id, doi, title, ids, type, publication_date, authorships, primary_location, best_oa_location, abstract_inverted_index, locations]
    # Backfill cuts 1-3 (2026-10-13; collection-yield.md §10, D304-D306): concept-group hits only; the
    # institution and author-id families keep every work. Counted per run as `cut_<name>` (+ `cut_<name>:<group>`).
    # Re-enable: delete an entry here (the coverage key changes, so the group re-sweeps from the floor).
    keyword_cuts:
      drop_sources: [publisher, self_publication]   # keep arXiv-located works and SSRN only
      # the unquoted token-AND groups without the CS field filter: "mechanistic interpretability" matches
      # "mechanistic" + "interpret*" anywhere (oncology, pavement mechanics); NOT phrase-quoted (loses arXiv papers)
      ai_term_groups: [rlhf, preference-opt, unlearning, cot-monitor, misalignment-behaviors, reward-hacking,
                       data-safety, mech-interp, sparse-coding, interp-tools, model-diffing, dev-interp, elk,
                       deception-detect, anomaly, safety-by-construction, corrigibility, oversight, w2s, debate,
                       capability-evals, scheming, stego, red-team]
      # The pre-2020 exception (D654), (a): a hit published before 2020 with a pre-2020 safety stem in title or abstract
      # (stack/rules.py PRE2020_SAFETY_STEMS: "AI safety", "superintelligence", "quantilizer", "safe reinforcement
      # learning", …) bypasses drop_sources, no-DOI works included; ai_term still applies. In every group's key.
      publisher_cut_floor: "2020-01-01"
      # (b): umbrella's windows before 2020 are asked without the CS-field filter (the period's philosophy-of-AI
      # venues). Only umbrella: measured 2026-10-21, relaxing every broad group adds ~168k 2015-2019 hits (data-
      # attribution +38.8k, power-seeking +30.0k, specs +27.8k, …); of a 50-hit sample of each group's added hits
      # 0-3 survive the cuts (arXiv-located non-CS papers), none on AI safety; umbrella adds 1,423, 5 of 50 survive,
      # 3 of them on AI safety.
      field_filter_floor: "2020-01-01"
      field_filter_groups: [umbrella]
      # the Chinese-coverage work (approved 2026-10-30): the publisher cut keeps hits with an ACL Anthology (10.18653), AAAI (10.1609),
      # IJCAI (10.24963), NDSS (10.14722) or PLOS (10.1371) DOI (stack/rules.py VENUE_DOI_PREFIXES; the oa lane fetched
      # 98 %, 89 %, 35/38, 9/9 and 7/7 of such store documents without an arXiv copy). The allowlist's digest is in every cut group's key: one re-sweep of the groups from 2015.
      keep_venues: true

  - id: anthropic_alignment_blog   # kind: scrape
    kind: scrape
    location: "https://alignment.anthropic.com"
    license_class: public_web
    channel_group: url
    self_published_org: anthropic
    politeness: { rate_rps: 0.5, respect_robots: true }

  - id: anthropic_cards        # kind: watch (per-lab card watcher)
    kind: watch
    # watch/scrape: collect (collect.cards) MAY fetch this `location` LISTING page only, parse it
    # in code, and mint one source per listed card (discovery.via='watch', watch_url), one
    # coverage row per scan; item CONTENT is fetched later by fetch, not here (10-design §5.1, D-M1).
    #
    # [FLAG for coordinator] The FULL v1 watch spec for each *_cards channel (discovery method,
    # include_re/exclude_re/policy_re/text_slug_re, extra listing surfaces, github repos, pinned
    # ids — ported from pipeline/config/doc_watch.yaml) does NOT fit here: channels.schema.json
    # sets additionalProperties:false with no `params`/`watch` field, and ChannelDef mirrors that
    # with extra="forbid". Per "report rather than hack", those selectors live in code, keyed by
    # channel id, in workflows/collect/cards/main.py:WATCH_SPECS. `location` below is the PRIMARY
    # listing surface only (some labs have several — the rest live in WATCH_SPECS). If the schema
    # is later widened to allow a `watch:`/`params:` block, the WATCH_SPECS table can move here.
    location: "https://www.anthropic.com/system-cards"   # v1 anthropic-systemcards surface (RSP surface is a 2nd spec)
    license_class: public_web
    channel_group: url
    self_published_org: anthropic
    politeness: { rate_rps: 0.5, respect_robots: true }

  - id: manual                 # v1's drop-folder channel. No collector reads `location`: collect.manual reads the
                                #   overrides chain and writes manual_<group> (workflows/collect/manual/main.py).
                                #   Kept as a channel id: collect.v3_import fails on a v3 row whose channel is not
                                #   here, and v1 rows without a discovery source were imported as `manual`.
    kind: manual
    location: "sources/_inbox"
    license_class: restricted
    channel_group: url   # drop folder: no scholarly keys; identity by location/file (§6 url group)

  - id: x                      # collect.x-lookup (round 4, track X): X API v2 post lookup by id (`kind: manual`
    kind: manual                #   because the schema has no lookup kind); one post per document (DESIGN §5.6)
    location: "https://x.com"
    license_class: api_tos
    channel_group: social
    miss_means: withdrawn       # a deleted, protected or suspended post (§5.6); retracted after the line's miss_cap
    non_merging_keys: [conversation_id, reply_to_id, quote_of, repost_of]
    record_projection: [post, thread, quoted, repost_of]   # without `includes` (context only); a done post is never re-asked

  # ───────────────────────────────────────────────────────────────────────────
  # Paper and forum channels below were first registered for the v1-corpus importer (collect.v1_import,
  # removed; v4's importer is collect.v3_import). Its table mapping each v1 `source` to a channel is in git
  # history of this file; v1 rows with no source, or a card of an unlisted lab, map to `manual`.
  #
  # License classing (project decision D8, conservative; docs/design/license-classes.md): arXiv carries an explicit
  # open license (enums.license_class `open` gloss
  # names arXiv directly) and LessWrong/AlignmentForum posts default to CC BY -> both get
  # license_class: open. Lab blogs/cards/policy docs are self-published and publicly
  # reachable but carry NO explicit open license -> license_class: public_web, matching the
  # anthropic_alignment_blog / anthropic_cards idiom already established above (NOT `open`,
  # despite the intent-shorthand "open-equivalent" — public_web is the closer registered
  # value for "publicly reachable, no explicit license"). openalex / europepmc /
  # semantic_scholar fulltexts were historically acquired by v1's fetchpdf waterfall, which
  # can include shadow-library sources on a PER-ITEM basis; that distinction cannot be
  # expressed at channel granularity (one license_class per channel, not per snapshot), and
  # blanket-applying `shadow` would misclassify the legitimate-OA fraction too — so these
  # three channels are classed conservatively as `restricted` (never `open`) rather than
  # `shadow`, per D8's explicit recommendation. A future per-fetch reclassification (once
  # fetch records real acquisition provenance) could sharpen this later.
  # Egress (llm.yaml egress.by_license_class, applied per LLM call by stack/llm/__init__.py `_egress_rule`;
  # a basis row without a license_class is sent as `restricted`, stack/annotate/stage.py): `restricted` and
  # `api_tos` allow providers [anthropic, openai], `shadow` [openai] only, `open` and `public_web` also
  # google-vertex. The `screen` role's model (openai/gpt-6-luna, which the plans also pin) and
  # `screen_adjudicate`'s (openai/gpt-5.6-terra) are permitted under every class.
  # ───────────────────────────────────────────────────────────────────────────

  - id: arxiv                  # kind: search (arXiv Atom API author sweep; v1 search_arxiv.py)
    kind: search
    location: "http://export.arxiv.org/api/query"
    license_class: open
    channel_group: paper
    breadth: standard
    from_date: "2020-01-01"
    politeness: { rate_rps: 0.33 }   # ~1 req / 3s (arXiv ToS)
    # the v3 parsed Atom entry (arxiv_sweep parse_feed); every field is stable
    record_projection: [arxiv_id, title, authors, abstract, pub_date]
    # collect.arxiv_sweep runs this channel as an AUTHOR sweep. Its two code-level parameters have
    # no channels.yaml schema slot (channel objects are additionalProperties:false, no `params`):
    #   - roster: configs/rosters/researchers.yaml (env STACK_ARXIV_ROSTER) — the frontier-lab
    #     researcher names, derived from the v1 DB (the only roster read; its header says how it is maintained).
    #   - category allowlist cs.AI,cs.LG,cs.CL,cs.CR,cs.CY,cs.MA,stat.ML + cs.GT,cs.LO,math.LO,
    #     econ.TH,q-bio.NC (rostered authors' game-theory, logic and decision-theory papers; SR
    #     scope note (e)) — a module constant in workflows/collect/arxiv_sweep/main.py (dodges
    #     physics namesakes on common surnames; physics stays excluded).
    # Two more query families in the same stage, same channel and keys (SR scope note (e)):
    #   - keyword family: one `(ti:"t" OR abs:"t" OR …)` query per concept group in the stage
    #     option `keyword_groups` (default [umbrella, steerability], SR 2025's own arXiv sweep),
    #     ANDed with the AI clause for `needs_ai_context` groups; coverage query `kw:group:<id>`;
    #   - scoped-category family: `cat:<c> AND (<AI clause>)` per category in the option
    #     `scoped_categories` (default the five above); coverage query `cat:<c>`.
    #   The AI clause is `ai_context` above plus a few agent/AGI phrases (module constant).
    #   Option `families` (default [author, kw, cat]) selects which run.

  # collect.forums sweeps lesswrong + alignmentforum together (v1 search_forums.py). TERM queries
  # come from `concept_groups` below (each carries its coverage topic_keys group:<id> +
  # technique:<slug> — the taxonomy join); LW-specific knobs with no schema slot (tag slug list,
  # min_karma 25) are documented, env-overridable constants in workflows/collect/forums/main.py.
  # collect does NOT hydrate post bodies (the /api/search response embeds them and v1 captured
  # them at search time; here fetch.http acquires content later — 10-design §5.1).
  - id: lesswrong               # kind: search (LessWrong ForumMagnum Algolia /api/search)
    kind: search
    location: "https://www.lesswrong.com"
    license_class: open
    channel_group: forum
    concept_groups: all
    breadth: standard
    from_date: "2020-01-01"
    # LW and AF are one ForumMagnum backend behind two hostnames — two pacer buckets, ~6.6 rps combined.
    politeness: { rate_rps: 3.3 }   # ~0.3s between requests
    # the Algolia hit (collect.forums: `body`) or the GraphQL post (collect.lw_graphql: `htmlBody`)
    # minus the counters `baseScore` etc. (C23); an absent field projects as null; `url` is read by the
    # lw_linkpost key adder (stack/identity.py)
    record_projection: [_id, title, postedAt, body, htmlBody, url]

  - id: alignmentforum          # kind: search (AlignmentForum: same ForumMagnum DB as lesswrong)
    kind: search
    location: "https://www.alignmentforum.org"
    license_class: open
    channel_group: forum
    concept_groups: all
    breadth: standard
    from_date: "2020-01-01"
    politeness: { rate_rps: 3.3 }   # ~0.3s between requests
    # the GraphQL post (af_graphql QUERY) minus the counter `baseScore` (C23)
    record_projection: [_id, title, postedAt, htmlBody, slug, user, coauthors]

  - id: europepmc               # kind: search
    kind: search
    location: "https://www.ebi.ac.uk/europepmc/webservices/rest/search"
    license_class: restricted   # D8: DOI-discovered fulltext waterfall, classed conservatively (see note above)
    channel_group: paper
    concept_groups: all
    breadth: standard
    from_date: "2020-01-01"
    politeness: { rate_rps: 5 }

  # collect.semantic_scholar runs this channel as the PHRASE-MATCH academic axis (v1's
  # `search-other-apis` stage, the S2 half of lib/search_engine.py). It is the channel that lights
  # the `misuse: true` groups: S2's boolean query language takes quoted phrases and an explicit
  # `+` (AND), so a misuse group can be intersected with the `ai_context` disjunction above — the
  # thing collect.openalex cannot express and therefore skips. Sends SEMANTIC_SCHOLAR_API_KEY
  # (free; environment or STACK_ENV_FILE) as x-api-key when set, else runs on the throttled
  # keyless pool; a rejected key fails the query `provider_auth` (no key-degrade).
  - id: semantic_scholar        # kind: search
    kind: search
    location: "https://api.semanticscholar.org/graph/v1/paper/search/bulk"
    license_class: restricted   # D8: DOI-discovered fulltext waterfall, classed conservatively (see note above)
    channel_group: paper
    concept_groups: all
    breadth: standard
    from_date: "2020-01-01"
    # READ (D550): the Gate's S2 interval, 1 / rate_rps, for every process (stack/provider_transport.py
    # CHANNEL_PACED). With the key at 0.95 rps S2 answered 429 to ~40 % of requests.
    politeness: { rate_rps: 0.4 }
    # Backfill cuts 1-2 (collection-yield.md §10; as on openalex); cut 5 is `s2_terms: []` on three groups.
    keyword_cuts:
      drop_sources: [publisher, self_publication]
      # The pre-2020 exception (D654 (a)), enabled here too: a hit published before 2020 with a pre-2020 safety stem
      # bypasses drop_sources. In every S2 group's coverage key: the 59 S2 queries re-sweep from 2015 once
      # (≈ 575 requests at ≥ 2.5 s, ≈ 25-50 min).
      publisher_cut_floor: "2020-01-01"
      # the Chinese-coverage work, as on openalex: the allowlisted venues' DOIs pass the publisher cut (a new key per group).
      keep_venues: true
      # ... only with an AI term in title or abstract: S2's group queries have no field filter, so llm-safety's
      # "safety evaluation" found PLOS biomedical papers (3 of 13 venue hits in a 2026-10-30 window).
      venue_ai_term: true
    # FIELDS minus the counter `citationCount` (C23)
    record_projection: [paperId, externalIds, title, abstract, authors, venue, year, publicationDate, publicationTypes, openAccessPdf]

  - id: openai_blog             # kind: scrape
    kind: scrape
    location: "https://openai.com"
    license_class: public_web
    channel_group: url
    self_published_org: openai
    politeness: { rate_rps: 0.5, respect_robots: true }

  - id: openai_alignment_blog   # kind: scrape
    kind: scrape
    location: "https://alignment.openai.com"
