# taxonomy-v0.6.yaml — THE taxonomy (10-design §8): 292 techniques over 15 facets, ported from
# `taxonomy/taxonomy-v0.6.yaml` (2026-07-23). Replaces the 3-technique `taxonomy-sample.yaml` as
# the registry-pinned artifact, so `concept_groups.techniques`, annotate facet answers and every
# absence claim now join against the real vocabulary.
#
# Shape transform applied by the port (the source predates the v3 config shape):
#   * facet answers `{facet: [values]}` -> `{facet: {values: [...], origin: initial_pass}}` —
#     every answer came from the one initial faceting pass, which is what that origin says;
#   * the source's per-facet `group:` key is dropped (not in the config schema);
#   * `empty_is_legal: true` on harm-area (240 of 292 techniques answer []) and
#     failure-disposition (114) — empty is a real assessed value there. NOT set on locus /
#     mechanism, whose only empties are `agent-foundations` (both) and
#     `model-welfare-assessment` (mechanism): two conceptual entries, not a facet policy. They
#     stay visible as outliers rather than being blessed by a flag.
#   * `population` / `difficulty` / `exclusive_with` / `absorbs` carried over from
#     taxonomy-sample.yaml for the five facets it covered, and only where the referenced value
#     slugs exist in this menu. The other ten facets carry no population/difficulty yet.
#
# [FLAG] The sample described a FUTURE v0.8 with ten facets — five of the fifteen here demoted to
# descriptive fields (`resource-cost` is a technique FIELD in the sample but a FACET here). That
# reduction is a taxonomy design decision, not a mechanical transform, so this port keeps v0.6
# exactly as authored. Move the pin to v0.8 when that artifact exists.
version: '0.6'
status: facet dictionary + faceted techniques (manifest-review fixes applied)
facets:
- slug: locus
  name: Lifecycle locus
  cardinality: multi
  population: AI-scored
  difficulty: low
  description: Where in the model lifecycle the technique acts. Multi-valued — a guardrail classifier
    acts at inference AND serves monitoring. The axis of the Lifecycle view.
  values:
  - slug: data
    name: Data
    description: Curating or filtering the training corpus before training.
  - slug: pretraining
    name: Pretraining
    description: During base-model pretraining — objectives or data interventions baked into the foundation
      model.
  - slug: post-training
    name: Post-training
    description: 'Alignment after pretraining: SFT, preference optimization, RL.'
  - slug: inference
    name: Inference
    description: Synchronously in the request path at generation time (decoding controls, input/output
      filters).
  - slug: agentic-runtime
    name: Agentic runtime
    description: While the model runs inside a tool-use / agent loop (sandboxing, action gating).
  - slug: evaluation
    name: Evaluation
    description: Measuring a property or capability before deployment (red-teaming, dangerous-capability
      evals) — a measurement stage.
  - slug: release-gating
    name: Release gating
    description: The go / no-go decision before release (capability thresholds, safety cases). Sparse
      for purely-technical techniques.
  - slug: monitoring
    name: Monitoring
    description: Asynchronous, observational watching of live traffic or internals after deployment.
  - slug: post-deployment
    name: Post-deployment
    description: 'After-the-fact operations: incident response, takedown, account action.'
  - slug: access-control
    name: Access control
    description: Serving-side gating of who or what may use the model (KYC, tiered access, egress).
- slug: function-role
  name: Function / role
  cardinality: single+
  description: What the technique DOES at the highest level — the claim-bearer-vs-evidence-producer cut.
    Distinguishes a mitigation from a measurement. Orthogonal to mechanism (which is HOW it buys safety).
  values:
  - slug: intervention
    name: Intervention
    description: Changes the model or system to make it safer — the claim-bearer (training, filtering,
      steering, sandboxing).
  - slug: evaluation
    name: Evaluation
    description: Measures a property or capability and produces evidence, without changing behavior (evals,
      red-teaming, uplift studies).
  - slug: runtime-monitoring
    name: Runtime monitoring
    description: Observes deployed behavior to catch problems — detection without prevention (CoT monitoring,
      abuse monitoring).
  - slug: containment
    name: Containment
    description: Limits the blast radius if behavior is bad (sandboxing, permissions, kill-switch, control
      protocols).
  - slug: theory
    name: Theory / foundations
    description: A conceptual or foundational framework, not yet an applied method (GSAI, ELK, agent foundations).
- slug: mechanism
  name: Safety mechanism
  cardinality: multi
  population: AI-scored
  difficulty: medium
  description: HOW the technique buys safety — the defense-in-depth axis. Lets a stack be checked for
    coverage across prevention / detection / containment. Multi-valued; discriminates most on the assurance
    half of the field.
  exclusive_with:
  - - restriction
    - correction
  absorbs:
    shaping:
    - correction
  values:
  - slug: shaping
    name: Shaping
    description: Changes what the model wants or does (training-time value alignment).
  - slug: restriction
    name: Restriction
    description: Removes or blocks a capability or content (data filtering, unlearning, gating).
  - slug: detection
    name: Detection
    description: Notices bad inputs, outputs, or behavior (classifiers, probes, evals).
  - slug: containment
    name: Containment
    description: Limits harm even if behavior is bad (sandbox, permissions, kill-switch).
  - slug: access-control
    name: Access control
    description: Gates who or what can invoke the model or a capability (KYC, tiered access, rate limit).
  - slug: verification
    name: Verification
    description: Checks or proves a property holds (safety cases, formal verification, debate-as-check).
  - slug: correction
    name: Correction
    description: Fixes or steers behavior after detection (activation steering, model editing, rollback).
  - slug: transparency
    name: Transparency
    description: Makes the model's internals legible (interpretability).
  - slug: attribution
    name: Attribution
    description: Traces origin or provenance (watermarking, training-data attribution, content credentials).
  - slug: response
    name: Response
    description: Acts after an incident (incident response, takedown, threat-intel).
- slug: failure-disposition
  name: Failure disposition
  cardinality: multi
  population: AI-scored
  difficulty: medium
  empty_is_legal: true
  description: The dispositional alignment concern the technique addresses, named as a property↔failure
    pole-pair so a filter on either pole returns the same concern. The Failure-mode view axis. (Resistance
    to EXTERNAL attacks is the `defends_against` edge, not here.)
  values:
  - slug: honesty-deception
    name: Honesty ↔ deception
    description: Truthful/calibrated vs strategically deceptive — includes scheming, alignment-faking,
      sandbagging.
  - slug: corrigibility-resistance
    name: Corrigibility ↔ shutdown-resistance
    description: Accepts correction/shutdown vs resists it — includes power-seeking, self-exfiltration.
  - slug: nonsycophancy-sycophancy
    name: Non-sycophancy ↔ sycophancy
    description: Holds true answers vs tells the user what they want to hear.
  - slug: rewardfaithful-rewardhacking
    name: Reward-faithfulness ↔ reward-hacking
    description: Pursues the intended goal vs games the proxy — reward-hacking, specification-gaming.
  - slug: goalrobust-misgeneralization
    name: Goal-robustness ↔ goal-misgeneralization
    description: Keeps the intended goal off-distribution vs misgeneralizes it.
  - slug: general-alignment
    name: General alignment (HHH)
    description: Broad helpful-honest-harmless conduct, not tied to one specific failure pole.
- slug: harm-area
  name: Harm area
  cardinality: multi
  population: AI-scored
  difficulty: medium
  empty_is_legal: true
  description: The real-world harm DOMAIN the technique helps prevent or evaluate — the Hazard view axis;
    maps ~1:1 to regulatory risk categories. Empty = not harm-domain-specific (most general training methods).
    CBRN = the rollup of bio/chem/nuclear/radiological.
  values:
  - slug: bio
    name: Biological
    description: Biological-weapon uplift.
  - slug: chem
    name: Chemical
    description: Chemical-weapon uplift.
  - slug: nuclear
    name: Nuclear
    description: Nuclear-weapon uplift.
  - slug: radiological
    name: Radiological
    description: Radiological-weapon uplift.
  - slug: cyber-offense
    name: Cyber-offense
    description: Offensive cyber capability or uplift (exploits, attacks, insecure code).
  - slug: autonomy
    name: Autonomy / loss-of-control
    description: Autonomous replication, self-improvement, power-seeking, loss of control.
  - slug: persuasion
    name: Persuasion / manipulation
    description: Mass persuasion, manipulation, influence operations.
  - slug: csae
    name: CSAE
    description: Child sexual abuse / exploitation material.
  - slug: privacy
    name: Privacy
    description: Personal-data leakage, memorization, person identification.
  - slug: fraud
    name: Fraud
    description: Scams, fraud, deception of third parties.
  - slug: misuse-at-scale
    name: Misuse at scale
    description: Scaled abuse — spam, disinformation volume, automated harm.
- slug: maturity
  name: Maturity
  cardinality: single
  population: human-set
  description: In-stack READINESS — how proven the technique is in practice. NOT effectiveness/validation
    (that is claim_tier). Decays over time (needs last_verified).
  values:
  - slug: theoretical
    name: Theoretical
    description: A concept or formal idea; no working implementation at scale.
  - slug: experimental
    name: Experimental
    description: Demonstrated in research or lab; not in production.
  - slug: piloted
    name: Piloted
    description: Early or limited production / trusted-tester use; not yet ubiquitous.
  - slug: deployed
    name: Deployed
    description: In routine production use in shipped systems.
- slug: adoption-breadth
  name: Adoption breadth
  cardinality: single
  description: How widely the technique is used — the mandatability (policymaker) and neglectedness (funder)
    signal. A corpus-derived LOWER BOUND (we may miss sources).
  values:
  - slug: proposed-only
    name: Proposed-only
    description: Proposed but no known production use by anyone.
  - slug: narrow
    name: Narrow
    description: Used by one org or a few orgs.
  - slug: common
    name: Common
    description: Used by many orgs; widespread.
  - slug: standard
    name: Standard
    description: De-facto universal; an expected baseline.
- slug: artifact-form
  name: Artifact form
  cardinality: single+
  description: What artifact or change you must build or run to use the technique — the integration-and-cost
    shape (the other half of the old `form`; function/role is the orthogonal half).
  values:
  - slug: data-pipeline
    name: Data pipeline
    description: A data-processing step (filter, dedup, synthetic-data generation).
  - slug: training-objective
    name: Training objective
    description: A loss or training procedure applied to the model.
  - slug: model-edit
    name: Model edit
    description: Direct weight surgery (unlearning, knowledge editing, merging).
  - slug: auxiliary-model
    name: Auxiliary model
    description: A separate model run alongside (classifier, reward model, monitor, probe).
  - slug: decoding
    name: Decoding strategy
    description: A generation-time sampling or steering strategy.
  - slug: prompt
    name: Prompt / spec
    description: A prompt or specification artifact (system prompt, constitution, instruction hierarchy).
  - slug: orchestration-protocol
    name: Orchestration protocol
    description: A multi-step runtime protocol (control protocol, debate, human-in-the-loop gate).
  - slug: infra-control
    name: Infra control
    description: An infrastructure or system control (sandbox, rate limit, access gate, weight security).
  - slug: eval-benchmark
    name: Eval / benchmark
    description: An evaluation suite or methodology.
  - slug: analysis-method
    name: Analysis method
    description: An interpretability or analysis procedure run on the model.
  - slug: theory-framework
    name: Theory framework
    description: A conceptual framework with no concrete artifact yet.
- slug: access-required
  name: Access required
  cardinality: single+
  description: 'The MINIMUM model access needed to APPLY the technique. (For what an outsider needs to
    CHECK it, see `verifiability`.) Gates applicability: white-box techniques only apply to open-weight
    models.'
  values:
  - slug: white-box
    name: White-box
    description: Needs weights or gradients (training, editing).
  - slug: grey-box
    name: Grey-box
    description: Needs activations or logits (probes, steering, some decoding).
  - slug: black-box
    name: Black-box
    description: Needs only inputs/outputs (prompting, I/O filters, RAG).
  - slug: infra
    name: Infra
    description: Needs deployment/infrastructure control (sandbox, rate limit, weight security).
- slug: verifiability
  name: Verifiability
  cardinality: single+
  description: 'What an OUTSIDER needs to CHECK the technique''s central claim — the produced property/effect
    for interventions, the produced verdict for evaluations (auditor/policymaker assessability; the claim→evidence
    axis). LENIENT: checks whether the claimed property HOLDS, not whether this technique CAUSED it (attribution
    is claim_tier''s job). Distinct from `access-required` (what you need to APPLY it). Set by where the
    confirming evidence lives.'
  values:
  - slug: self-attested
    name: Self-attested
    description: No external signature; only the developer can confirm (internal-only evals, proprietary
      RMs, pure process claims).
  - slug: output-checkable
    name: Output-checkable
    description: Claimed property/verdict checkable from model outputs (black-box) — most behavior-shaping
      training, guardrails, refusals, robustness, reproducible benchmarks.
  - slug: grey-box-probing
    name: Grey-box probing
    description: Checkable only with activation/logit access (interpretability probes, latent monitors).
  - slug: white-box
    name: White-box
    description: Checkable only with weights (weight-level interpretability, weight watermarks, model-merge
      inspection).
  - slug: training-process-inspection
    name: Training-process inspection
    description: Checkable only by inspecting the training data/process (data filtering, dedup, PII-scrubbing
      — claims about the corpus; outputs cannot prove the negative).
- slug: modality
  name: Modality
  cardinality: multi
  description: 'Which modality the technique is specific to. RULE: tag a specific modality ONLY when the
    mechanism intrinsically requires it (image-watermarking needs pixels); otherwise `agnostic`. ENCODING
    (b): a modality-agnostic technique is stored DENORMALIZED as `agnostic` PLUS all current modality
    tags [text, vision, audio, video], so exact-match filters on any modality catch it while `agnostic`
    preserves the genuine-vs-incidental distinction (text-SPECIFIC only = has `text` and NOT `agnostic`).'
  values:
  - slug: text
    name: Text
    description: Text/token-specific (mechanism tied to text).
  - slug: vision
    name: Vision
    description: Image / vision-specific.
  - slug: audio
    name: Audio
    description: Audio / speech-specific.
  - slug: video
    name: Video
    description: Video-specific.
  - slug: agnostic
    name: Agnostic
    description: Modality-independent (e.g. RLHF, DPO); stored alongside all modality tags per encoding
      (b).
- slug: threat-source
  name: Threat source
  cardinality: multi
  description: Who or what the technique defends against. `none-benign` for techniques that just improve
    behavior under normal use (most training/honesty methods).
  values:
  - slug: none-benign
    name: None / benign
    description: No adversary; improves behavior under normal or careless use (calibration, honesty, helpfulness).
  - slug: misuse-user
    name: Misuse user
    description: A user deliberately misusing the model via the normal interface (jailbreaks, dangerous-capability
      requests).
  - slug: external-attacker
    name: External attacker
    description: A third party attacking via the environment or supply-chain, or stealing assets (prompt
      injection, data poisoning, extraction, weight theft — incl. insiders).
  - slug: untrusted-model
    name: Untrusted model
    description: The model itself as the threat (scheming, sabotage — the AI-control setting).
- slug: trend
  name: Trend
  cardinality: single
  description: The technique's momentum in the field — the forecaster/funder temporal signal. A bit noisy;
    coarse on purpose.
  values:
  - slug: emerging
    name: Emerging
    description: Newly active; growing attention or use.
  - slug: stable
    name: Stable
    description: Established and steadily used.
  - slug: declining
    name: Declining
    description: Losing attention or use.
  - slug: dormant
    name: Dormant
    description: Abandoned / graveyard; kept for reference.
- slug: resource-cost
  name: Resource cost
  cardinality: single
  description: All-in cost to apply and run the technique (compute + data + engineering). Distinct from
    capability-tax.
  values:
  - slug: low
    name: Low
    description: Cheap to apply or run (a prompt, a blocklist).
  - slug: medium
    name: Medium
    description: Moderate compute / data / engineering (a classifier, an SFT pass).
  - slug: high
    name: High
    description: Expensive (a full RL run, large red-team effort, frontier eval).
  - slug: unknown
    name: Unknown
    description: Not determinable from public information.
- slug: capability-tax
  name: Capability tax
  cardinality: single
  description: How much the technique costs in model capability or helpfulness (over-refusal, degradation).
    `contested` is a real, common state.
  values:
  - slug: none
    name: None
    description: No notable capability cost.
  - slug: minor
    name: Minor
    description: Small, usually-acceptable degradation (mild over-refusal).
  - slug: major
    name: Major
    description: Significant capability or helpfulness loss.
  - slug: contested
    name: Contested
    description: Disputed whether or how much it costs.
edges:
- slug: defends_against
  target: technique
  description: This (defense) technique defends against that (attack) technique. Replaces the old attack-target
    facet; vocabulary is the catalogued attacks themselves.
- slug: composes_with
  target: technique
  description: Works well stacked with another technique (defense-in-depth).
- slug: conflicts_with
  target: technique
  description: Interferes with / is redundant-or-counterproductive alongside another technique.
- slug: variant_of
  target: technique
  description: This entry is a variant of a parent technique (e.g. dpo.ipo -> dpo).
- slug: maps_to_standard
  target: standard
  description: Discharges or is referenced by a standard / regulation (NIST RMF, EU AI Act, ISO).
- slug: critiqued_by
  target: source
  description: A notable critique / negative result about this technique.
- slug: requires
  target: technique
  description: A precondition this technique needs to run (e.g. RLVR requires a verifiable reward).
fields:
- slug: tldr
  name: TL;DR
  description: One-paragraph plain-language gloss for a non-expert reader.
- slug: known_limitations
  name: Known limitations
  description: Where the technique itself breaks / residual risk after applying it (distinct from what
    it targets).
- slug: evasion_gameability
  name: Evasion / gameability
  description: How it is bypassed, faked, or Goodharted (safety-washing surface). Often access-tiered.
- slug: safety_argument
  name: Safety argument
  description: The argument for why it buys safety, plus the assumptions it rests on and the conditions
    that defeat it.
- slug: requires_preconditions
  name: Requires / preconditions
  description: What must exist for it to work (a reward model, a verifier, human prefs).
- slug: scope_of_validity
  name: Scope of validity
  description: Conditions under which its evidence holds (scale/regime, languages, modalities, single-
    vs multi-turn).
- slug: effectiveness
  name: Effectiveness
  description: Coarse, eval-anchored effect where known (e.g. reduces jailbreak ASR X->Y on benchmark
    B); carries claim_tier.
- slug: flagship_example
  name: Flagship example
  description: One illustrative deployed instance / model ('behind ChatGPT refusals', Llama Guard, SynthID).
techniques:
- slug: model-based-data-quality-filtering
  name: Model-based data quality filtering
  type: technique
  family: data-curation
  description: Uses trained classifier or scoring models (n-gram perplexity, neural regressors, or prompted
    LLMs) to rate documents in a training corpus on quality dimensions and drop low-scoring or policy-violating
    text before training. Distinguished from hand-written heuristic filters by using a learned model as
    the quality signal.
  facets:
    locus:
      values:
      - data
      origin: initial_pass
    function-role:
      values:
      - intervention
      origin: initial_pass
    mechanism:
      values:
      - restriction
      origin: initial_pass
    failure-disposition:
      values: []
      origin: initial_pass
    harm-area:
      values: []
      origin: initial_pass
    maturity:
      values:
      - deployed
      origin: initial_pass
    adoption-breadth:
      values:
      - common
      origin: initial_pass
    artifact-form:
      values:
      - data-pipeline
      - auxiliary-model
      origin: initial_pass
    access-required:
      values:
      - white-box
      origin: initial_pass
    verifiability:
      values:
      - training-process-inspection
      origin: initial_pass
    modality:
      values:
      - agnostic
      - text
      - vision
      - audio
      - video
      origin: initial_pass
    threat-source:
      values:
      - none-benign
      origin: initial_pass
    trend:
      values:
      - emerging
      origin: initial_pass
    resource-cost:
      values:
      - medium
