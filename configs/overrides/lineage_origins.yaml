# lineage_origins.yaml - the curated origin list of the narrow-model lineage (pre-2020 scope review round 2,
# D664): origin works of catalogued safety techniques in ML security, privacy, interpretability,
# robustness, poisoning, model extraction/inversion, unlearning and verification, restricted to (1) works before
# the store's 2015 paper floor and (2) venue-gap works the collectors cannot reach (Distill, proceedings-only).
#
# APPROVED AS PREPARED (owner review, 2026-10-21; D664). The operator imports it at build time (entries are `human`-tier
# overrides once added).
# Input to `stack overrides add` (docs/howto/overrides.md); no stage reads it from here. The file is a mapping of
# targets (manual_sources, screen, stack_relevance), so one add imports all three:
#   stack overrides add configs/overrides/lineage_origins.yaml --out data/overrides/<series>/ --dry-run   # writes nothing
#   stack overrides add configs/overrides/lineage_origins.yaml --out data/overrides/<series>/ --comment scope-r2-d1b
# Independent of configs/overrides/manual_sources.yaml (D6): no shared override id and no shared target; either may
# be added first. The manual sources need the same plan lines as that file's (`collect.manual` with
# `miss_cap: 1`, gate `{rule: manual_accept}`, acquire wants `manual_url: [page]`, `manual_paper: [full_text]`).
# Validated by tests/test_overrides_lineage_origins.py.
#
# Mechanisms (override_id prefix):
#   ms-lo-      manual source, flag `accept`: triage fetches the document without asking. 23 works absent from the
#               store, 2 present but triage-skipped (their DOI URL joins the existing document, so the flag lands
#               on it). arXiv/DOI URLs where the full text is open; an author-hosted PDF where the DOI is
#               paywalled. Each entry has `title`, `authors` and `published_at` (D666; the note's year as
#               `<year>-01-01`, read as year-only; author names from OpenAlex, the PDF's first page or the
#               note): the source's own metadata, merged by gather like any member's (ranked after every
#               collected channel, so a joined OpenAlex record's values come first).
#   scr-lo-     screen field overrides: `verdict: relevant` and `off_topic_reason: null` (the record otherwise keeps
#   srel-lo-    the model's quotes and reasoning); stack_relevance field override `verdict: relevant`. Only for the
#               3 present Distill documents whose members are known now.
# The R question (sr_relevance) is not overridden: the target is "retained as S-relevant"; the model's own R
# answer stands (an `sr_relevance` field entry `verdict: irrelevant` would express "R irrelevant", but would
# contradict the model where it sees an agenda: Activation Atlas and the linkpost copy of Zoom In are R relevant).
#
# Scope pinning: a screen override applies only while `scope.members` equals the document's live members
# (stack/annotate/select.py); any other member set leaves it unapplied and listed in `override_stale_ids`.
# The members below are those of the documents head of 2026-10-20 (checked on a read-only mirror 2026-10-21).
# Not expressible now (source ids are minted at collect time, so no doc_id or members exist yet): the screen
# overrides for the 25 `ms-lo-` works and for D6's Cao & Yang (ms-r2-lm-75). They are a second file, written
# after the first build that gathers these sources (procedure in docs/howto/overrides.md, "Prepared files").
#
# Taxonomy ids: the registry pin, configs/taxonomy-v0.6.yaml. Ids and URLs checked 2026-10-21: arXiv ids and DOIs
# against OpenAlex (one request; the arXiv ids 1306.4447 and 1708.06131 on their abstract pages), every PDF URL
# fetched once and its first page read; except the CAV 2010 DOI (paywalled; full text not verified).

