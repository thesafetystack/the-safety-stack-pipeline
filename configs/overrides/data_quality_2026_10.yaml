# data_quality_2026_10.yaml - data-quality fixes from the review of release 2026-10-27 (approved 2026-10-30; D768, D772, D774).
#
# Input to `stack overrides add` (a mapping of targets, as lineage_origins.yaml; docs/howto/overrides.md); no stage reads
# it from here. The import is an operator step at build time:
#   stack overrides add configs/overrides/data_quality_2026_10.yaml --out data/overrides/<series>/ --dry-run   # writes nothing
#   stack overrides add configs/overrides/data_quality_2026_10.yaml --out data/overrides/<series>/ --comment data-quality
# Independent of the other files of this directory (no shared override id, document or source). Validated by
# tests/test_overrides_data_quality.py. author: data-quality-2026-10 (configs/releases/dataset/overrides-public.yaml
# maps it to its public author and method). Ids and stored values were checked against the documents head of
# 2026-10-23 (the store copy the 2026-10-27 candidate was exported from).
#
# fields (title-2026-10-30-<doc>, doctype-2026-10-30-<doc>): 85 bibliographic fixes of 84 documents, which D759 had
# made at export time (configs/releases/dataset/corrections.yaml, removed): 42 card titles derived from a URL slug
# that lost the dots of a version number, 7 with the document word appended twice (one of them also lost dots), 9
# OpenAI deploymentsafety titles with the listing's date line and description run in, 8 documents headed "Model Card"
# that their listing typed system_card, 17 NULL doc_types of forum-post links (lesswrong.com/lw/, the Intelligent Agent
# Foundations forum) and 3 of hand-added arXiv papers. Each note: the public sentence, then `Rule: <reasons>.` (the rule
# the value follows, checked by the test) and `Stored: <JSON>.` (the value the store held). Since collect.cards
# derives these titles and types right for new sources (D759), a fix is needed only for the stored ones.
# Effect at the next build: a changed title or doc_type changes the document's fields_digest, so gather returns the
# 84 documents to `identified` and triage scopes them again. All 84 are `fetch` by a gate rule (64 *_cards documents:
# frontier_lab_posts; 17 links_url: selected_links; 3 manual_paper: manual_accept), so no decision changes; since D724
# the asker still asks each scoped row the triage question once (a signal, 84 calls of the triage role), and acquire
# re-points them without a fetch. No other annotation's basis reads these fields (the screen and the other annotate
# workflows key their work on the text), so nothing else is asked again.
#
# identity (merge-2026-10-30-<page doc>): 152 merges of 305 documents, each a lab or safety-org blog page (or a card
# page) and the forum copy of it that no detector joined: 132 crossposts (same title, published within 7 days or
# undated, no byline conflict, at least 70 % of one copy's text found in the other; most lab blogs carry no byline, so
# post_title_author cannot join them), 14 linkposts to the page's former address (a site moved its posts; the URL
# rules MOVED_POST_PATHS of stack/urls.py, D772, give a page row that address as a key, but only rows collected from
# now on or re-keyed with `stack migrate rekey`, so the stored pairs need these merges) and 6 that are both. One merge
# joins three documents (two forum posts linking OpenAI's former superalignment URL, both copies of the page). Each
# note: the public first sentence, `Rule: <crosspost, linkpost_moved_url>.`, the text containment of the pair, the
# former URL. Effect at the next build (simulated on the 2026-10-23 head with gather's and acquire's own functions):
# the survivor is the earliest-observed anchor (107 pages, 45 forum posts); the 153 others retire into it
# (former_doc_ids). The merged metadata ranks the forum member first (PROVIDER_RANK), as for the 159 forum+blog
# documents the detectors joined already: 108 survivors change (byline 108, date 107, title 81, doc_type 107: 106
# lab_blog and 1 framework_policy become forum_post). Their fields_digest changes, so triage asks each once (108
# signal calls; every survivor's primary role is ok, so no decision changes). In the same 108 the current text moves
# to the forum copy's (acquire's pointer rule), so every text workflow's work key (source and text digest) becomes the
# absorbed document's own, whose answers exist: no screen, technique_staged, model_roles or affiliation ask.
#
# technique_staged (ts-2026-10-30-<doc>): 4 row overrides that drop the 5 technique rows (4 forum posts,
# chain-of-thought-monitoring 4, rlhf 1) whose only quote is the rubric's worked example ("If I had a research budget
# I would put all of it on monitoring reasoni…", cut here), which the model copied from the prompt: every such quote
# was flagged quote_unverified. The review counted 6 rows in 5 posts; the 2026-10-25 technique_staged file and the
# 2026-10-27 candidate hold 5 rows in 4. A document-grain workflow has no item override, so each entry is the model's
# whole payload (the 2026-10-25 file) minus those rows (`row: true`); the document whose only row it was gets the flag
# no_techniques_found, as an answer with no rows has; `repairs` stay as the model's run wrote them. Scoped to the
# document's live members and its current text (scope.basis_digest): a new text or member set leaves the override
# stale and the model's answer stands. Provenance: the overrides are the decision (D717), so these four rows carry the
# overrides' fingerprint as config_digest and match no pinned technique_staged config; the note names the model's
# evidence id and config. The release ships each as an annotation_replacement, its quotes capped like any row's. No
# ask at any stage.
