# china_coverage.yaml - hand-added sources of the Chinese-coverage review (approved 2026-10-30, D740).
#
# Input to `stack overrides add` (a mapping of targets, as lineage_origins.yaml; docs/howto/overrides.md); no stage reads
# it from here. The import is an operator step at build time:
#   stack overrides add configs/overrides/china_coverage.yaml --out data/overrides/<series>/ --dry-run   # writes nothing
#   stack overrides add configs/overrides/china_coverage.yaml --out data/overrides/<series>/ --comment china-coverage
# Independent of manual_sources.yaml and lineage_origins.yaml (no shared override id, no shared URL). Needs the plan
# lines those files need (`collect.manual` with `miss_cap: 1`, gate `{rule: manual_accept}`, acquire wants
# `manual_url: [page]`, `manual_paper: [full_text]`; batch-2026-10a has them). Validated by
# tests/test_overrides_china_coverage.py.
#
# Flags: the ms-cn-doc- entries are `accept` (triage fetches them without asking; the screen still judges them); the
# ms-cn-cdb- entries carry no flag (D754): triage and the screen judge them like any collected paper.
#   ms-cn-cdb-<arXiv id>   the papers of the Concordia AI Chinese Technical AI Safety Database (public Google Sheet,
#                          2025-07 export, 464 arXiv papers 2023-05 to 2025-05) absent from the 2026-10-27 release:
#                          92 not in the store (the entry adds them), 15 in it but triage-skipped or screened
#                          irrelevant (the arXiv URL joins that document; without a flag their decisions stand).
#                          About 43 of the 92 were judged out of scope by title (watermarking, deepfakes,
#                          hallucination). Title and date from the arXiv API (2026-10-29).
#   ms-cn-doc-<slug>       the Chinese frameworks, standards, statements and reports of the review's checklist plus
#                          one of the same series (Concordia Spring 2024): English or bilingual versions where they
#                          exist, else the Chinese original (Chinese documents may enter the release). URLs checked
#                          2026-10-30 (HTTP 200/206). tc260.org.cn answers scripted clients with its homepage, so its
#                          two PDFs are pinned Wayback captures of the original bytes
#                          (`web.archive.org/web/<timestamp>id_/<url>`): collect.manual keeps that form as the fetch
#                          URL and acquire mints the capture (via wayback); the key is the live URL's. Four
#                          WeChat articles (mp.weixin.qq.com: the AIIA safety commitments 2024 and their 2025
#                          framework, CAICT's AI Safety Benchmark 2024 and 2.0) were dropped on 2026-10-30: Tencent
#                          answers this pipeline's client with an interactive captcha page whatever the request
#                          headers, so a fetch yields that page, never the article. A later entry with another copy
#                          (a pinned Wayback capture holding the article) or a hand-made text may add them back.
#                          A date with only a month known is written as the month's first day.
#   added_by: china-coverage (configs/releases/dataset/overrides-public.yaml maps it to its public author and method).
manual_sources:
# ---- ms-cn-doc-: frameworks, standards, statements, reports
- override_id: ms-cn-doc-tc260-framework-1
