  title: "AI Safety Governance Framework (V1.0)"
  published_at: 2024-09-09
  flags: [accept]
  note: "TC260 (National Technical Committee 260 on Cybersecurity), AI Safety Governance Framework 1.0, September 2024; official English PDF (the archived copy: tc260.org.cn answers scripted clients with an anti-bot page; the Chinese PDF is upload/2024-09-09/1725849142029046390.pdf). Frontier risks incl. bio/cyber misuse and loss of control. Language: en."
  added_by: china-coverage
