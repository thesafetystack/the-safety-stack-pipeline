# manual_sources.yaml - hand-added sources prepared for the pre-2020 scope review round 2 (D658).
#
# Input to `stack overrides add` (target `manual_sources`, from this file's stem; docs/howto/overrides.md); not read
# by any stage from here. The import is an operator step:
#   stack overrides add configs/overrides/manual_sources.yaml --out data/overrides/<series>/ --dry-run   # writes nothing
#   stack overrides add configs/overrides/manual_sources.yaml --out data/overrides/<series>/ --comment scope-r2-d6
# Entries take effect only in a plan that runs `collect.manual` (stage line `miss_cap: 1`), gates on
# `{rule: manual_accept}` and gives acquire wants for `manual_url: [page]` and `manual_paper: [full_text]`; the
# `collect_links` flags only in a plan that also runs `collect.links` (rule `flagged_links`, an LLM budget) and
# gates on `{rule: selected_links}` (configs/plans/links-scratch.yaml has all of these).
# Validated by tests/test_collect_manual.py (`test_prepared_manual_sources_*`).
#
# Flags: `accept` = triage fetches the document without asking (rule `manual_accept`); the screen still judges it.
# `collect_links` = the document becomes a linking document for `collect.links`.
#
# Blocks (override_id prefix):
#   ms-r2-lm-          the 14 venue-gap landmarks of the review's landmark list plus #119 (Chollet), `accept`
#   ms-r2-d3-          three landmarks the D3 re-sweep should find (#10, #92, #38), listed as a fallback, `accept`
#   ms-r2-miri-post-   the 37 MIRI "New paper / New report" announcement posts, `collect_links`
#   ms-r2-miri-similar- 8 further MIRI paper-announcement posts, `collect_links`
#   ms-r2-miri-pdf-    the papers those 45 posts announce, as direct URLs, `accept`
# Why the PDFs are listed directly: collect.links dropped a link to the linking page's own host as a self-link, and
# the MIRI PDFs live on the posts' host (intelligence.org), so `collect_links` on the posts collected none of them
# (it still reaches their off-host links). Since D665 a flagged page keeps its same-host PDF links, so the selector
# sees these PDFs as well; the list stays until a build shows it picks them (both key the URL alike and join one
# document). Papers the store already holds with a full text are left out.
#
# Identity: an arXiv or DOI URL is keyed by that id (it joins any member of the same paper); any other URL is keyed by
# the URL only and never joins an OpenAlex or Semantic Scholar record of the same work (those carry no url keys).
# Metadata (D666): `title`, `authors` and `published_at` are the source's own metadata fields (collect.manual writes
# them into its `sources` row; gather merges them like any member's, ranking the manual channels after every
# collected channel, so they only fill gaps; a `fields` override forces a value). Every `accept` entry has a title
# and a date, and authors where a source on hand names them (the PDF's first page, the arXiv page); the
# announcement posts have none (their `miri_blog` member gives the title). Dates: the earliest public date at hand, as a day when the PDF's first page, the note or the MIRI
# announcement post that released the PDF gives one, else the note's year as `<year>-01-01` (read as year-only).
# Where the PDF differs from the note (title, author), the PDF wins; the notes are unchanged.
# Prepared and checked 2026-10-21: every URL fetched once (PDF first pages read) except the OpenAI and Medium pages,
# which answer 403 to scripted clients (acquire's http lane then falls back to the Wayback Machine).

