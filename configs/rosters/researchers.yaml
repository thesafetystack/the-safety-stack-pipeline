# researchers.yaml — the researcher roster: names for collect.arxiv_sweep's author family and OpenAlex author
# ids for collect.openalex's author-id family (`author_ids: true`).
#
# PROVENANCE: derived from the v1 pipeline DB (pipeline/data/stack_review.db,
# meta table key 'people' — the tracked-researcher list v1 accumulated). Names
# ONLY: the emails / Twitter / LinkedIn / OpenAlex-id fields present in the v1
# JSON are deliberately dropped, and v1's `arxivName` column (the useless
# Lastname_Firstinitial form, e.g. "Perez_E") is NOT carried — collect.arxiv_sweep
# derives the arXiv `au:` query name (Lastname_Firstname) from the full name in
# code (an initial matches almost nothing on arXiv's author index).
#
# This file is the roster the collectors read; no other roster source is read. Names are edited by hand
# (hygiene below); the `openalex_ids` are written by tools/resolve_openalex_authors.py (`--write-roster`,
# which keeps the rest of the file as it is) or by hand from its report.
#
# Schema-light (not one of the files stack/config.py validates and stamps): parsed by stack/collect/roster.py
# for collect.arxiv_sweep and collect.openalex (default path <config_dir>/rosters/researchers.yaml, env
# override STACK_ARXIV_ROSTER). Deterministic + sorted.
# Hygiene (round 4, track P, D229; docs/design/collection-yield.md §3.2): `Last, First` entries are
# read as `First Last` by collect.arxiv_sweep (roster_name), so they and their `First Last` twins are
# one query; dropped: forum-username twins of working entries (Andrew_Critch, Jacob_Hilton,
# CallumMcDougall, bilalchughtai, james.lucassen), the fragments Dvijotham / Krishnamurthy (of
# "Krishnamurthy Dvijotham"), "Zhang" (v1 record has no first name) and "Llama Team, AI @ Meta";
# Stuart_Armstrong -> "Stuart Armstrong". Added (SR scope, D196): Vanessa Kosoy, Caspar Oesterheld,
# Vincent Conitzer, Daniel Murfet, Adam Shai. Not added, for a later check of whether they post AI
# work to arXiv at all (LessWrong/Alignment Forum authors, reached by collect.forums/lw_graphql):
# Steven Byrnes, John Wentworth.
# OpenAlex author ids (round 5 (RUN) B7b, C4; version 1.2.0): an entry may be a mapping
# `{name, openalex_ids: [A…], orcid?}` (stack/collect/roster.py). The ids are written by
# tools/resolve_openalex_authors.py where its rule accepts one profile, or by hand from its report
# docs/design/openalex-author-ids.md; collect.openalex's author-id family (option `author_ids`) sweeps
# them. `disambiguate`: the high-volume names of collection-yield.md §3.2 (>= 4 hits in a 21-day
# sample, mostly namesakes or out-of-scope work): the arXiv author sweep keeps their hits only with a
# safety stem or a second roster author (C4); with its option `disambiguate_by_id` a listed name that
# has openalex_ids is swept by id only.
# 1.3.0 (T-ARX R, 2026-10-13): the resolver's coauthor rule (shared works with resolved roster people)
# added ids for 286 more names and 128 split profiles of resolved names; several ids = one person.
# 1.3.1: its merged-profile guard removed 11 ids whose profiles absorbed namesakes (e.g. "Jian Yang"
# -> A5100404947, 2,571 works in 2026); counts in docs/design/openalex-author-ids.md.
# 1.4.0 (D655, 2026-10-21): ids for rostered safety names that had none (Stuart Armstrong, Nick
# Bostrom with a split profile, Vincent Conitzer, Beth Barnes) and new names with ids (Jessica Taylor, Benja
# Fallenstein, Tsvi Benson-Tilsen, Kaj Sotala, Daniel Dewey, Roman Yampolskiy, Anders Sandberg, Seth Baum, Guy
# Katz, Patrick LaVictoire, Sam Eisenstat). Each id was checked by hand against a known work of the person
# (title, year, coauthors); the name search misresolves several of these names. No OpenAlex profile carries
# the works of Benjamin Hilton, Ryan Carey or James (Jim) Babcock (their authorships are unresolved) or Wei
# Dai: Carey and Babcock are added as names only. Not used: A5038101556 ("Elizabeth A. Barnes"), a climate
# scientist's profile that also holds METR papers. Marcus Hutter (as "Marcus Hütter") and János Kramár
# already had their ids.
# 1.5.0 (approved 2026-10-30): 16 Chinese AI-safety researchers, the most frequent authors of the Concordia AI
# Chinese Technical AI Safety Database (2025-07 export; 5-19 papers each) not on the roster, mostly of its key research
# groups (Shanghai AI Lab, Tsinghua CoAI and TSAIL, Fudan NLP/FVL, Tianjin NLP, SJTU, Beihang, HKUST-GZ, CUHK-SZ,
# CAS/BIAISG). tools/resolve_openalex_authors.py resolved 3 of 16 (13 ambiguous: common names); every id below was
# checked by hand instead: the OpenAlex works of up to six of the person's database papers (by arXiv DOI) and the
# author id they carry under the name, with the institution (Minlie Huang 6 of 6, Tsinghua; Xuanjing Huang 5 of 6,
# Fudan; Deyi Xiong 5 of 6, Tianjin; Xipeng Qiu 5 of 6, Fudan (the resolver's pick A5000302538, a 13-work
# profile, not used); Yu-Gang Jiang 6 of 6; Xinlei He 5 of 5; Yinpeng Dong 5 of 5 (A5068755794) plus the resolver's
# coauthor-linked split profile; Zhuosheng Zhang 6 of 6; Tao Gui 5 of 6; Xingjun Ma 4 of 5; Aishan Liu 3 of 4; Baoyuan
# Wu 3 of 5). Names only (their papers scatter over several profiles or none): Jing Shao, Yu Qiao, Yingchun Wang,
# Yi Zeng. `disambiguate` gains the four (common names) and the six prolific generalists (296-522 works each, mostly
# NLP and vision): their arXiv hits are kept only with a safety stem or a second roster author.
# 1.5.1 (2026-11-02): comments only (internal labels reworded); no name or id moves.
